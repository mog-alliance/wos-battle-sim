    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(c => e.appendChild(c));
    return e;
  }
  function getNum(id, def) {
    const e = document.getElementById(id);
    if (!e) return def || 0;
    const v = parseFloat(e.value);
    return isNaN(v) ? (def || 0) : v;
  }
  function getVal(id, def) {
    const e = document.getElementById(id);
    return e ? e.value : def;
  }

  // ---------------- 対戦シナリオ ----------------
  // 'self-attack'  : 自軍=集結(攻撃) / 敵=駐屯(防衛)  ※既定
  // 'self-defense' : 自軍=駐屯(防衛) / 敵=集結(攻撃)
  function getScenario() { return getVal('scenario', 'self-attack'); }
  function selfMode() { return getScenario() === 'self-defense' ? 'defense' : 'attack'; }
  function enemyMode() { return getScenario() === 'self-defense' ? 'attack' : 'defense'; }

  // heroes grouped by role for the dropdowns
  const HEROES_BY_ROLE = { shield: [], spear: [], archer: [] };
  Object.keys(HEROES).forEach(key => {
    const h = HEROES[key];
    if (HEROES_BY_ROLE[h.role]) HEROES_BY_ROLE[h.role].push({ key, name: h.name });
  });

  // ---------------- 通常のバフ(実際の「追加ステータス」画面の数値をそのまま入力) ----------------
  // ゲーム内の英雄比較画面にある「追加ステータス」(兵科ごとの攻撃力/防御力/殺傷力/HP、領主装備・
  // 英雄・専門家・戦争研究・ペットのベースバフ等すべて込みの合計%)を、そのまま入力してもらう欄。
  // ペットを「有効化」した場合にのみ乗る個別追加効果(ペットごとに内容が異なる)は対象外(考慮しない)。
  const STAT_BUFF_FIELDS = [
    { key: 'atk', label: '攻撃力+%' },
    { key: 'def', label: '防御力+%' },
    { key: 'leth', label: '殺傷力+%' },
    { key: 'hp', label: 'HP+%' },
  ];

  function buildStatBuffTable(prefix) {
    const wrap = el('div', { style: 'margin:14px 0;' });
    wrap.appendChild(el('div', { text: '通常のバフ(追加ステータス画面の数値をそのまま入力)', style: 'font-weight:600;margin-bottom:4px;' }));
    wrap.appendChild(el('p', {
      class: 'sub',
      text: '英雄詳細の「追加ステータス」比較画面に表示される、兵科ごとの合計%をそのまま入力してください(領主装備・専門家・戦争研究・ペットのベースバフ等すべて込みの数値)。ペットを有効化した場合のみ乗る個別追加効果は含めなくてOKです。',
      style: 'margin:0 0 8px 0;',
    }));
    const table = el('table', { class: 'stat-table', style: 'font-size:12px;' });
    const thead = el('thead');
    const headRow = el('tr');
    headRow.appendChild(el('th', { text: '兵科' }));
    STAT_BUFF_FIELDS.forEach(f => headRow.appendChild(el('th', { text: f.label, style: 'font-weight:600;' })));
    thead.appendChild(headRow);
    table.appendChild(thead);
    const tbody = el('tbody');
    ORDER.forEach(t => {
      const tr = el('tr');
      tr.appendChild(el('td', { class: 'type-' + t, text: TYPE_LABEL[t], style: 'white-space:nowrap;padding-right:6px;' }));
      STAT_BUFF_FIELDS.forEach(f => {
        const td = el('td', { style: 'padding:2px 4px;' });
        td.appendChild(el('input', {
          type: 'number', id: `${prefix}-statbuff-${t}-${f.key}`, value: '0', step: 'any',
          style: 'width:80px;padding:3px 4px;border:1px solid var(--input-border);border-radius:4px;background:var(--input-bg);color:var(--text);',
        }));
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  function readStatBuff(prefix) {
    const statBuff = {};
    ORDER.forEach(t => {
      statBuff[t] = {};
      STAT_BUFF_FIELDS.forEach(f => { statBuff[t][f.key] = getNum(`${prefix}-statbuff-${t}-${f.key}`, 0); });
    });
    return statBuff;
  }
  function applyStatBuff(prefix, statBuff) {
    if (!statBuff) return;
    ORDER.forEach(t => {
      const s = statBuff[t];
      if (!s) return;
      STAT_BUFF_FIELDS.forEach(f => {
        const el2 = document.getElementById(`${prefix}-statbuff-${t}-${f.key}`);
        if (el2 && s[f.key] != null) el2.value = s[f.key];
      });
    });
  }

  function buildHeroSelect(id, role) {
    const sel = el('select', { id });
    sel.appendChild(el('option', { value: '', text: '(未選択)' }));
    HEROES_BY_ROLE[role].forEach(h => sel.appendChild(el('option', { value: h.key, text: h.name })));
    return sel;
  }

  function describeHeroEffect(heroKey, eqLv, mode) {
    if (!heroKey || !HEROES[heroKey]) return '';
    const hero = HEROES[heroKey];
    const lines = [];
    (hero.buffs || []).forEach(b => {
      const statLabel = { dealt: '与ダメージ', taken: '被ダメージ', hp: 'HP' }[b.stat];
      const scopeLabel = b.scope === 'all' ? '味方全部隊' : TYPE_LABEL[b.scope];
      lines.push(`${scopeLabel}の${statLabel} ${b.pct >= 0 ? '+' : ''}${(b.pct * 100).toFixed(1)}%`);
    });
    (hero.periodicBuffs || []).forEach(pb => {
      const statLabel = { dealt: '与ダメージ', taken: '被ダメージ', hp: 'HP' }[pb.stat];
      const scopeLabel = pb.scope === 'all' ? '味方全部隊' : TYPE_LABEL[pb.scope];
      lines.push(`[周期発動] ${scopeLabel}の${statLabel} ${pb.pct >= 0 ? '+' : ''}${(pb.pct * 100).toFixed(1)}% (${pb.cycleTurns}ターンの周期のうち${pb.activeTurns}ターンだけ有効。発動タイミングは結果の「ターン毎の内訳」に表示されます)`);
    });
    if (hero.enemyDebuff) {
      const statLabel = { dealt: '与ダメージ', taken: '被ダメージ' }[hero.enemyDebuff.stat];
      lines.push(`敵デバフ: 敵全部隊の${statLabel} ${hero.enemyDebuff.pct >= 0 ? '+' : ''}${(hero.enemyDebuff.pct * 100).toFixed(1)}%`);
    }
    if (hero.equip) {
      const eqF = Math.max(0, Math.min(5, eqLv || 0)) / 5;
      const statPctNow = hero.equip.statPct * eqF * 100;
      lines.push(`[専用装備] 殺傷力/HP +${statPctNow.toFixed(1)}%(レベルに比例、計算に反映済み)`);
      if (hero.equip.skill) {
        const modeLabel = hero.equip.skill.mode === 'attack' ? '集結(攻撃)' : '駐屯(防衛)';
        const active = hero.equip.skill.mode === mode;
        const statLabel = { dealt: '与ダメージ', taken: '被ダメージ', hp: 'HP' }[hero.equip.skill.stat];
        const magnitude = 15 * eqF;
        const signedPct = hero.equip.skill.stat === 'taken' ? -magnitude : magnitude;
        lines.push(`[専用装備スキル・${modeLabel}用] 味方全部隊の${statLabel} ${signedPct >= 0 ? '+' : ''}${signedPct.toFixed(1)}% ${active ? '(現在のモードで有効)' : '(現在のモードでは発動しません)'}`);
      }
    }
    return lines.join('<br>');
  }

  // ---------------- 兵科パネル(自軍A/B・敵軍で共通の構造) ----------------
  function buildSidePanel(container, prefix) {
    container.innerHTML = '';

    // Tier・火晶レベルは兵科(盾兵/槍兵/弓兵)ごとに別々に設定できるスライダー。
    const topGrid = el('div', { class: 'grid3' });
    ORDER.forEach(t => {
      const box = el('div', { class: 'hero-box' });
      box.appendChild(el('div', { text: TYPE_LABEL[t], style: 'font-weight:600;margin-bottom:6px;' }));

      const lvWrap = el('div', { style: 'margin-bottom:8px;' });
      lvWrap.appendChild(el('label', { text: 'Tier(T10.0〜T11.0)', style: 'font-size:11px;color:var(--muted);' }));
      const lvRow = el('div', { class: 'slider-row' });
      const lvRange = el('input', { type: 'range', id: `${prefix}-lv-${t}`, min: '10', max: '11', step: '0.1', value: '10' });
      const lvVal = el('span', { class: 'slider-val', id: `${prefix}-lv-${t}-val`, text: '10.0', style: 'min-width:34px;' });
      lvRow.appendChild(lvRange); lvRow.appendChild(lvVal);
      lvWrap.appendChild(lvRow);
      box.appendChild(lvWrap);

      const fcWrap = el('div', {});
      fcWrap.appendChild(el('label', { text: '火晶レベル(0〜10)', style: 'font-size:11px;color:var(--muted);' }));
      const fcRow = el('div', { class: 'slider-row' });
      const fcRange = el('input', { type: 'range', id: `${prefix}-fc-${t}`, min: '0', max: '10', step: '1', value: '7' });
      const fcVal = el('span', { class: 'slider-val', id: `${prefix}-fc-${t}-val`, text: '7' });
      fcRow.appendChild(fcRange); fcRow.appendChild(fcVal);
      fcWrap.appendChild(fcRow);
      box.appendChild(fcWrap);

      lvRange.addEventListener('input', () => {
        lvVal.textContent = Number(lvRange.value).toFixed(1);
        updateStatTable(prefix);
      });
      fcRange.addEventListener('input', () => {
        fcVal.textContent = fcRange.value;
        updateStatTable(prefix);
      });

      topGrid.appendChild(box);
    });
    container.appendChild(topGrid);

    const countGrid = el('div', { class: 'grid3' });
    ORDER.forEach(t => {
      countGrid.appendChild(makeField(`${prefix}-count-${t}`, `${TYPE_LABEL[t]} 兵力数`, 1000));
    });
    container.appendChild(countGrid);

    // 駐屯(防衛)側のときだけ意味を持つ項目。「非表示にしてほしいが、裏のロジックは残したままでいい」
    // とのご要望を受け、この2項目(城壁・拠点補正/駐屯盾兵優先補充ボーナス)の入力欄自体は常に非表示
    // (display:none)にしている。ただしDOM要素・既定値(城壁補正0%・盾兵優先補充+20%)はそのまま残して
    // あるため、getNum('${prefix}-wall',0)・getNum('${prefix}-replenish',20)を読む既存の計算ロジックは
    // 一切変更していない(=既定値が従来通り計算に使われ続ける)。
    const defGrid = el('div', { class: 'grid3', id: `${prefix}-defense-fields`, style: 'display:none;' });
    defGrid.appendChild(makeField(`${prefix}-wall`, '城壁・拠点補正 追加被ダメ軽減(%)', 0));
    const replWrap = el('div', { class: 'field' });
    replWrap.appendChild(el('label', {}, [
      document.createTextNode('駐屯 盾兵優先補充ボーナス(盾兵の実効HP+%)'),
      el('button', { type: 'button', class: 'info-icon', 'data-info': 'shield-replenish', title: 'この項目について' }, [document.createTextNode('i')]),
    ]));
    replWrap.appendChild(el('input', { type: 'number', id: `${prefix}-replenish`, value: '20' }));
    defGrid.appendChild(replWrap);
    container.appendChild(defGrid);
    const defNote = el('p', { class: 'sub', text: '↑ この項目は、このサイドが駐屯(防衛)側のときのみ計算に反映されます。', id: `${prefix}-defense-note`, style: 'display:none;' });
    container.appendChild(defNote);

    const statBox = el('div', { style: 'margin:10px 0;' });
    const statTable = el('table', { class: 'stat-table', id: `${prefix}-stat-table` });
    statTable.innerHTML = `<thead><tr><th>兵科</th><th>攻撃力</th><th>防御力</th><th>HP</th><th>殺傷力</th></tr></thead><tbody></tbody>`;
    statBox.appendChild(el('p', { text: 'Tier・火晶レベルから自動計算された基礎ステータス(参考表示)', style: 'font-size:12px;color:var(--muted);margin:0 0 4px 0;' }));
    statBox.appendChild(statTable);
    container.appendChild(statBox);

    // 【今回】「この火晶レベルではこのスキルが発動しています」がその場でわかるように、
    // 火晶レベルスライダーの値に応じてリアルタイムに切り替わる一覧を追加。
    const fcSkillBox = el('div', { style: 'margin:10px 0;' });
    fcSkillBox.appendChild(el('p', { style: 'font-size:12px;color:var(--muted);margin:0 0 4px 0;' }, [
      document.createTextNode('現在の火晶レベルで発動中の兵科スキル(参考表示)'),
      el('button', { type: 'button', class: 'info-icon', 'data-info': 'fc-skills', title: 'この項目について' }, [document.createTextNode('i')]),
    ]));
    fcSkillBox.appendChild(el('div', { id: `${prefix}-fc-skill-list`, style: 'font-size:12.5px;line-height:1.7;' }));
    container.appendChild(fcSkillBox);

    const heroGrid = el('div', { class: 'grid3' });
    ORDER.forEach(role => {
      const box = el('div', { class: 'hero-box' });
      box.appendChild(el('div', { text: `${TYPE_LABEL[role]}担当英雄`, style: 'font-weight:600;margin-bottom:6px;' }));
      const sel = buildHeroSelect(`${prefix}-hero-${role}`, role);
      box.appendChild(sel);
      const eqWrap = el('div', { style: 'margin-top:6px;' });
      eqWrap.appendChild(el('label', { text: '専用装備レベル', style: 'font-size:11px;color:var(--muted);' }));
      const sliderRow = el('div', { class: 'slider-row' });
      const range = el('input', { type: 'range', id: `${prefix}-eq-${role}`, min: '0', max: '5', step: '1', value: '5' });
      const valSpan = el('span', { class: 'slider-val', id: `${prefix}-eq-${role}-val`, text: '5' });
      sliderRow.appendChild(range);
      sliderRow.appendChild(valSpan);
      eqWrap.appendChild(sliderRow);
      box.appendChild(eqWrap);
      const effectBox = el('div', { class: 'hero-effect', id: `${prefix}-effect-${role}` });
      box.appendChild(effectBox);
      heroGrid.appendChild(box);

      sel.addEventListener('change', () => updateHeroEffect(prefix, role));
      range.addEventListener('input', () => {
        valSpan.textContent = range.value;
        updateHeroEffect(prefix, role);
      });
    });
    container.appendChild(heroGrid);

    container.appendChild(buildStatBuffTable(prefix));

    updateStatTable(prefix);
    ORDER.forEach(role => updateHeroEffect(prefix, role));
  }

  function makeField(id, label, value, opts) {
    const wrap = el('div', { class: 'field' });
    wrap.appendChild(el('label', { text: label }));
    const input = el('input', Object.assign({ type: 'number', id, value: String(value), step: 'any' }, opts || {}));
    wrap.appendChild(input);
    return wrap;
  }

  function updateStatTable(prefix) {
    const tbody = document.querySelector(`#${prefix}-stat-table tbody`);
    tbody.innerHTML = '';
    ORDER.forEach(t => {
      const lv = getNum(`${prefix}-lv-${t}`, 10);
      const fc = getNum(`${prefix}-fc-${t}`, 7);
      const s = SimCore.troopStats(t, lv, fc);
      const tr = el('tr');
      tr.appendChild(el('td', { class: 'type-' + t, text: TYPE_LABEL[t] }));
      tr.appendChild(el('td', { text: s.atk.toFixed(2) }));
      tr.appendChild(el('td', { text: s.def.toFixed(2) }));
      tr.appendChild(el('td', { text: s.hp.toFixed(2) }));
      tr.appendChild(el('td', { text: s.leth.toFixed(2) }));
      tbody.appendChild(tr);
    });
    updateFcSkillList(prefix);
  }

  // 【今回】火晶レベルのスライダー値に応じて、そのレベルで実際に発動している兵科固有スキル
  // (sim-core.jsのfcSkill()。閾値Lv3/5/8/10で段階的に強化)をリアルタイム表示する。
  // updateStatTable()の呼び出し元(Tier/火晶レベルスライダーのinputイベント、初期描画)と
  // 完全に連動させるため、updateStatTable内から呼び出す形にしている。
  function updateFcSkillList(prefix) {
    const box = document.getElementById(`${prefix}-fc-skill-list`);
    if (!box) return;
    box.innerHTML = '';
    ORDER.forEach(t => {
      const fc = getNum(`${prefix}-fc-${t}`, 7);
      const info = SimCore.fcSkill(t, fc);
      const row = el('div', { style: 'margin-bottom:3px;' });
      row.appendChild(el('span', { class: 'type-' + t, text: `${TYPE_LABEL[t]}(火晶Lv${fc}): `, style: 'font-weight:600;' }));
      if (!info.note || info.note.length === 0) {
        row.appendChild(el('span', { text: '発動中のスキルなし(火晶Lv3未満)', style: 'color:var(--muted);' }));
      } else {
        row.appendChild(document.createTextNode(info.note.join(' / ')));
      }
      box.appendChild(row);
    });
  }

  // prefix==='defender' なら敵軍側、それ以外(A/B)なら自軍側のモードを見る
  function modeForPrefix(prefix) {
    return prefix === 'defender' ? enemyMode() : selfMode();
  }

  function updateHeroEffect(prefix, role) {
    const heroKey = getVal(`${prefix}-hero-${role}`, '');
    const eqLv = getNum(`${prefix}-eq-${role}`, 5);
    const box = document.getElementById(`${prefix}-effect-${role}`);
    if (box) box.innerHTML = describeHeroEffect(heroKey, eqLv, modeForPrefix(prefix));
  }

  // ---------------- config組み立て ----------------
  function readSideConfig(prefix) {
    const mode = modeForPrefix(prefix);
    const heroes = {};
    ORDER.forEach(role => {
      heroes[role] = { heroKey: getVal(`${prefix}-hero-${role}`, ''), eqLv: getNum(`${prefix}-eq-${role}`, 5) };
    });
    const counts = {};
    ORDER.forEach(t => { counts[t] = getNum(`${prefix}-count-${t}`, 0); });
    const lv = {}, fc = {};
    ORDER.forEach(t => { lv[t] = getNum(`${prefix}-lv-${t}`, 10); fc[t] = getNum(`${prefix}-fc-${t}`, 7); });
    const config = {
      lv,
      fc,
      counts,
      heroes,
      mode,
      statBuff: readStatBuff(prefix),
    };
    if (mode === 'defense') {
      config.wallMitigationPercent = getNum(`${prefix}-wall`, 0);
      config.shieldReplenishBonus = getNum(`${prefix}-replenish`, 20) / 100;
    }
    return config;
  }

  function readMech() {
    return {
      counterBonus: getNum('mech-counter', 10) / 100,
      // 以下3つはT7で解放される兵科固有スキル(wostools.net/wiki/troops/で数値確認済み)。
      // このツールはTier T10.0〜T11.0のみ対応=常にT7以上のため、入力を求めず固定値として扱う。
      bandsOfSteel: 0.10, // 盾兵「鋼の帯」: 槍兵に対する防御力+10%
      volleyMult: 0.10,   // 弓兵「連射」: 10%の確率で2回攻撃→期待値換算で与ダメ+10%
      ambushRate: 0.20,   // 槍兵「奇襲」: 攻撃の20%が後列の弓兵に直撃
      // 【v4.16】以前は「兵力数のダメージ寄与指数(1.0=比例、0.5=平方根)」という入力欄で切り替えられる
      // ようにしていたが、「平方根モデルのみでいい・1.0/0.5という表現がわかりにくい」とのご指摘を受け、
      // 入力欄を廃止して平方根モデル(0.5)に固定した。
      countScalingExponent: 0.5,
    };
  }

  // ---------------- シナリオ反映(役割バッジ・防衛専用項目の表示切替) ----------------
  function applyScenario() {
    const sMode = selfMode(), eMode = enemyMode();
    const roleText = m => m === 'defense' ? '駐屯(防衛)' : '集結(攻撃)';

    document.getElementById('self-role-badge').textContent = roleText(sMode);
    document.getElementById('enemy-role-badge').textContent = roleText(eMode);
    document.getElementById('self-role-desc').textContent =
      sMode === 'defense' ? '自軍は拠点(砦・王城・ステーション・要塞など)で駐屯(防衛)します。専用装備スキルは駐屯用のもののみ発動します。'
                           : '自軍は集結(攻撃)で敵の拠点(砦・王城・ステーション・要塞など)を攻めます。専用装備スキルは集結用のもののみ発動します。';
    document.getElementById('enemy-role-desc').textContent =
      eMode === 'defense' ? '敵軍は拠点(砦・王城・ステーション・要塞など)で駐屯(防衛)します。専用装備スキルは駐屯用のもののみ発動します。'
                           : '敵軍が集結(攻撃)で自軍の拠点(砦・王城・ステーション・要塞など)を攻めてきます。専用装備スキルは集結用のもののみ発動します。';

    // 【今回】「城壁・拠点補正 追加被ダメ軽減(%)」「駐屯 盾兵優先補充ボーナス(盾兵の実効HP+%)」は
    // 画面から非表示にしてほしいとのご要望を受け、駐屯(防衛)モードであってもこの2項目の入力欄自体は
    // 表示しないようにした(常時 display:none)。ただし要素はDOM上に残したまま(buildSidePanel側で
    // 生成される`${prefix}-wall`/`${prefix}-replenish`の値はそのまま)なので、計算ロジック
    // (getNum('${prefix}-wall',0)・getNum('${prefix}-replenish',20)を読む箇所)は一切変更していない
    // =既定値(城壁補正0%・盾兵優先補充+20%)が従来通り計算に使われ続ける。
    ['A', 'B'].forEach(p => {
      ORDER.forEach(role => updateHeroEffect(p, role));
    });
    ORDER.forEach(role => updateHeroEffect('defender', role));
  }

  // ---------------- タブ ----------------
  function setupTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`panel-${btn.dataset.tab}`).classList.add('active');
      });
    });
  }

  // ---------------- Bパターン(ABテスト)の有効/無効切り替え ----------------
  // v4.13: 「Bパターンは使わない場合がある」とのご指摘に対応し、既定では非表示・未使用の
  // オプトイン機能にした(以前はBパターンのタブ・入力欄が常に存在し、兵力未入力の場合のみ
  // 結果側で自動非表示にしていたが、入力側は常に表示されたままだった)。
  function isPatternBEnabled() {
    const cb = document.getElementById('enable-pattern-b');
    return !!(cb && cb.checked);
  }
  function updatePatternBVisibility() {
    const enabled = isPatternBEnabled();
    // v4.18: 「パターンAという名称・タブは既定(1つだけ)のときは不要」とのご指摘に対応し、
    // Bパターンが無効な間はタブバー自体(A/Bどちらのタブも)を非表示にする。パターンAの入力欄
    // (panel-A)自体はタブなしでそのまま表示され続ける(内部的なA/Bという識別子は維持したまま、
    // 画面上に「パターンA」という名前・タブを一切出さない)。
    document.getElementById('pattern-tabs').style.display = enabled ? 'flex' : 'none';
    if (!enabled) {
      // Bタブが現在アクティブなまま非表示にはしない(Aタブへ強制的に戻す)。
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelector('.tab-btn[data-tab="A"]').classList.add('active');
      document.getElementById('panel-A').classList.add('active');
    }
    document.getElementById('btn-run').textContent = enabled ? 'パターンA・Bをシミュレーション実行' : 'シミュレーション実行';
  }
  function setupPatternBToggle() {
    document.getElementById('enable-pattern-b').addEventListener('change', updatePatternBVisibility);
    updatePatternBVisibility();
  }

  // ---------------- 結果表示 ----------------
  const WINNER_LABEL = {
    attacker: { text: '攻撃側 勝利(占領成功)', cls: 'badge-win' },
    defender: { text: '防衛側 勝利(攻撃側全滅/撤退)', cls: 'badge-lose' },
    draw: { text: '相討ち(両軍壊滅)', cls: 'badge-draw' },
    undecided: { text: '未決着(倍率・設定を見直してください)', cls: 'badge-undecided' },
  };
  function fmt(n) { return Math.round(n).toLocaleString('ja-JP'); }

  // 【v4.28】もともとrenderResultCard内のローカル関数だったスキル表示の整形ロジックを、PDFレポート
  // 出力機能(buildPdfReportContent)からも同じ内容を使い回せるようモジュールスコープに引き上げた。
  // 表示ロジック自体の変更はない(定義場所の移動のみ)。
  // 表内では「ノラ(槍兵/S5)」のような兵種/シーズン注記を省き「ノラ」とだけ表示する(担当兵科は
  // 見出し・スロットから既に自明なため、幅の限られる列では簡潔さを優先する)。
  const shortHeroName = (name) => name.replace(/\([^)]*\)\s*$/, '');
  const KIND_LABEL = { 遠征スキル: '遠征スキル', 専用装備スキル: '専用装備スキル', 敵デバフ: '敵デバフ', periodic: '周期発動スキル', proc: '確率発動スキル' };
  // 1英雄が複数の異なるスキル(例: 遠征スキル+専用装備スキル)を持つ場合、それぞれ別項目として
  // 列挙する(「誰の」だけでなく「どのスキルが」発動しているかをユーザーが判別できるようにするため、v4.8)。
  // skillNameが判明している場合は実際のスキル名も表示し、未確認の英雄はスキル種別のみを表示する(名称の捏造はしない)。
  // 各スキルを「英雄名[スキル種別:スキル名]」の1行に整形する(重複除去込み)。
  const fmtOneSkill = (s) => {
    const short = shortHeroName(s.heroName);
    const kindLabel = KIND_LABEL[s.kind] || s.kind;
    // 【v4.31】「スキル名の横の英語表記は不要」とのご指摘を受け、以前は和名(skillNameJa)が判明して
    // いる場合に英語名(skillName)を括弧書きで併記していたが、これを廃止し和名(判明していれば)のみを
    // 表示するようにした。和名が未確認の場合は、名称を捏造しないという方針を維持しつつ、代わりに
    // 英語名をそのまま表示する(和名・英語名のいずれも不明な場合のみ無表示)。
    const displayName = s.skillNameJa || s.skillName;
    const nameSuffix = displayName ? `:${displayName}` : '';
    let activeSuffix = '';
    if (s.kind === 'periodic') activeSuffix = '・発動中';
    else if (s.kind === 'proc') activeSuffix = `・発動(確率${Math.round((s.chance || 0) * 100)}%、乱数例)`;
    return `${short}[${kindLabel}${nameSuffix}${activeSuffix}]`;
  };
  const dedupeSkillList = (list) => {
    const seen = new Set();
    return (list || []).filter(s => {
      const key = `${s.heroName}|${s.kind}|${s.skillName || ''}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  };
  // 「自軍:」「敵軍:」の見出し1行+スキルごとに1行、という形でセル内に積む(スキルが複数ある場合に
  // 1行のカンマ区切りで詰め込むと視認しづらいため、v4.8でスキルごとに改行する形に変更)。
  const buildSkillGroup = (label, list) => {
    const wrap = el('div', { style: 'margin-bottom:4px;' });
    wrap.appendChild(el('div', { text: label, style: 'font-weight:600;' }));
    const deduped = dedupeSkillList(list);
    if (deduped.length === 0) {
      wrap.appendChild(el('div', { text: '-', style: 'padding-left:6px;color:var(--muted);' }));
    } else {
      deduped.forEach(s => wrap.appendChild(el('div', { text: fmtOneSkill(s), style: 'padding-left:6px;' })));
    }
    return wrap;
  };

  function renderResultCard(label, res, reqMult, selfIsAttacker) {
    const card = el('div', { class: 'result-card' });
    // v4.18: 比較対象(パターンB)が無効なときはlabelを空文字にして渡すため、見出し自体を出さない
    // (「パターンA」という名称は、実際に2つを比較しているときだけ表示する)。
    if (label) card.appendChild(el('h3', { text: label }));
    const w = WINNER_LABEL[res.winner] || WINNER_LABEL.undecided;
    const p1 = el('p');
    p1.appendChild(el('span', { class: 'badge ' + w.cls, text: w.text }));
    card.appendChild(p1);

    const selfKey = selfIsAttacker ? 'attacker' : 'defender';
    const enemyKey = selfIsAttacker ? 'defender' : 'attacker';

    const remTable = el('table', { class: 'stat-table' });
    remTable.innerHTML = `<thead><tr><th></th><th class="type-shield">盾兵</th><th class="type-spear">槍兵</th><th class="type-archer">弓兵</th><th>合計</th></tr></thead>`;
    const rtbody = el('tbody');
    [['自軍 残存', selfKey], ['敵軍 残存', enemyKey]].forEach(([label2, k]) => {
      const r = res.remaining[k];
      const total = r.shield + r.spear + r.archer;
      const tr = el('tr');
      tr.appendChild(el('td', { text: label2 }));
      tr.appendChild(el('td', { text: fmt(r.shield) }));
      tr.appendChild(el('td', { text: fmt(r.spear) }));
      tr.appendChild(el('td', { text: fmt(r.archer) }));
      tr.appendChild(el('td', { text: fmt(total) }));
      rtbody.appendChild(tr);
    });
    remTable.appendChild(rtbody);
    card.appendChild(el('p', { text: '残存兵力', style: 'font-weight:600;margin:10px 0 2px 0;' }));
    card.appendChild(remTable);

    const lossTable = el('table', { class: 'stat-table' });
    lossTable.innerHTML = `<thead><tr><th></th><th class="type-shield">盾兵</th><th class="type-spear">槍兵</th><th class="type-archer">弓兵</th></tr></thead>`;
    const ltbody = el('tbody');
    [['自軍 損耗', res.losses[selfKey]], ['敵軍 損耗', res.losses[enemyKey]]].forEach(([lb, d]) => {
      const tr = el('tr');
      tr.appendChild(el('td', { text: lb }));
      tr.appendChild(el('td', { text: fmt(d.shield) }));
      tr.appendChild(el('td', { text: fmt(d.spear) }));
      tr.appendChild(el('td', { text: fmt(d.archer) }));
      ltbody.appendChild(tr);
    });
    lossTable.appendChild(ltbody);
    card.appendChild(el('p', { text: '損耗数(死亡/負傷の内訳は非計算)', style: 'font-weight:600;margin:10px 0 2px 0;' }));
    card.appendChild(lossTable);

    // 【v4.11】常時発動しているスキル(遠征スキル/専用装備スキル/敵デバフ)は、ターンが変わっても
    // 内容が変わらないため、以前のようにターン毎の内訳表の全行に繰り返し表示すると非常に読みづらかった
    // (「見づらい」というご指摘の主因)。ここで1回だけ表示し、ターン毎の内訳表は実際にターンごとに
    // 変動する要素(周期発動スキル・確率発動スキル)だけに絞る。
    const constWrap = el('div', { style: 'margin-top:10px;' });
    constWrap.appendChild(el('p', { style: 'font-weight:600;margin:0 0 4px 0;' }, [
      document.createTextNode('常時発動しているスキル(遠征スキル/専用装備スキル/敵デバフ)'),
      el('button', { type: 'button', class: 'info-icon', 'data-info': 'constant-skills', title: 'この欄について' }, [document.createTextNode('i')]),
    ]));
    const constBox = el('div', { style: 'font-size:12.5px;line-height:1.5;display:flex;gap:24px;flex-wrap:wrap;' });
    const selfConstList = (res.sideConstants && res.sideConstants[selfKey]) || [];
    const enemyConstList = (res.sideConstants && res.sideConstants[enemyKey]) || [];
    constBox.appendChild(buildSkillGroup('自軍:', selfConstList));
    constBox.appendChild(buildSkillGroup('敵軍:', enemyConstList));
    constWrap.appendChild(constBox);
    card.appendChild(constWrap);

    // 【v4.12】「ターン毎の内訳」を、(1)純粋に数字だけの損耗数テーブルと、(2)周期/確率発動スキルが
    // 「どのターンで発動したか」を横一列で一望できるタイムライン表、の2つに分離した。以前は1行=1ターンで
    // スキルの説明文をテキストで積んでいたため、行ごとに高さが不揃いになり縦に長くなって読みづらかった
    // (「ターン毎の内訳の表がみづらい」という繰り返しのご指摘)。タイムライン表は1行=1スキルにし、
    // 列をターン番号にして、発動したタームだけ色付きマークを置く形式(ガントチャート的な見せ方)にすることで、
    // 「いつ発動したか」を文章を読まずに一目で追えるようにした。
    const details = el('details', { style: 'margin-top:10px;', open: true });
    details.appendChild(el('summary', { text: 'ターン毎の内訳を見る', style: 'cursor:pointer;font-size:12.5px;color:var(--accent-bright);' }));

    // --- (1) 損耗数テーブル(純粋に数字のみ、3列) ---
    const miniWrap = el('div', { class: 'mini-table' });
    const rt = el('table');
    rt.innerHTML = `<thead>
      <tr>
        <th>ターン</th>
        <th>自軍損耗(盾/槍/弓)</th>
        <th>敵軍損耗=自軍キル数(盾/槍/弓)</th>
      </tr>
    </thead>`;
    const rtb = el('tbody');
    const fmtLossTriple = (loss) => `${fmt(loss.shield)} / ${fmt(loss.spear)} / ${fmt(loss.archer)}`;
    (res.history || []).forEach(h => {
      // 「自軍の損耗」= 自軍が失った兵数。「敵軍の損耗」= 敵軍が失った兵数(=自軍から見たキル数)。
      const selfLoss = selfIsAttacker ? h.attackerLosses : h.defenderLosses;
      const enemyLoss = selfIsAttacker ? h.defenderLosses : h.attackerLosses;
      const tr = el('tr');
      tr.appendChild(el('td', { text: h.turn }));
      tr.appendChild(el('td', { text: fmtLossTriple(selfLoss) }));
      tr.appendChild(el('td', { text: fmtLossTriple(enemyLoss) }));
      rtb.appendChild(tr);
    });
    rt.appendChild(rtb);
    miniWrap.appendChild(rt);
    details.appendChild(el('p', { text: '損耗数の推移', style: 'font-weight:600;margin:8px 0 2px 0;font-size:12.5px;' }));
    details.appendChild(miniWrap);

    // --- (2) 「発動しうる全スキル」のタイムライン表(1行=1スキル、1列=1ターン) ---
    // 【v4.13】「遠征スキルがターン毎にどんな感じで発動するか見たい」というご指摘に対応し、
    // v4.12では周期/確率発動スキルのみだったこのタイムラインに、遠征スキル・専用装備スキル・
    // 敵デバフ(=「常時発動しているスキル」欄と同じ内容)も行として統合した。これらは戦闘中ずっと
    // 同じ条件で発動し続けるため、全ターンのセルが緑色で埋まった行として表示され、「その英雄の
    // その遠征スキルは全ターンにわたって発動し続けている」ことが一目でわかる(周期発動=青、
    // 確率発動=オレンジは間欠的に埋まる)。「常時発動しているスキル」欄(v4.11)も引き続き
    // 上部に残しているが、このタイムライン表だけを見れば全種類のスキルの発動状況をターン単位で
    // 追えるようにした。
    const rowsMap = new Map(); // key -> {sideLabel, heroName, kind, skillName, skillNameJa, chance, turns:Set}
    const collectRow = (sideLabel, s, turn) => {
      const key = `${sideLabel}|${s.heroName}|${s.kind}|${s.skillName || ''}`;
      if (!rowsMap.has(key)) {
        rowsMap.set(key, { sideLabel, heroName: s.heroName, kind: s.kind, skillName: s.skillName, skillNameJa: s.skillNameJa, chance: s.chance, turns: new Set() });
      }
      rowsMap.get(key).turns.add(turn);
    };
    (res.history || []).forEach(h => {
      const selfActive = selfIsAttacker ? h.attackerActiveSkills : h.defenderActiveSkills;
      const enemyActive = selfIsAttacker ? h.defenderActiveSkills : h.attackerActiveSkills;
      (selfActive || []).forEach(s => collectRow('自軍', s, h.turn));
      (enemyActive || []).forEach(s => collectRow('敵軍', s, h.turn));
    });
    const turnNumbers = (res.history || []).map(h => h.turn);
    // 常時発動スキル(遠征スキル/専用装備スキル/敵デバフ)を、全ターンにわたって発動中の行として追加する。
    const CONST_KINDS = new Set(['遠征スキル', '専用装備スキル', '敵デバフ']);
    dedupeSkillList(selfConstList).forEach(s => turnNumbers.forEach(t => collectRow('自軍', s, t)));
    dedupeSkillList(enemyConstList).forEach(s => turnNumbers.forEach(t => collectRow('敵軍', s, t)));
    // 常時発動スキル(緑)→周期発動スキル(青)→確率発動スキル(オレンジ)の順に並べ、種類ごとに
    // まとまって表示されるようにする(自軍を先に、敵軍を後に)。
    const kindOrder = { '遠征スキル': 0, '専用装備スキル': 1, '敵デバフ': 2, periodic: 3, proc: 4 };
    const sortedRows = Array.from(rowsMap.values()).sort((a, b) => {
      if (a.sideLabel !== b.sideLabel) return a.sideLabel === '自軍' ? -1 : 1;
      const ao = kindOrder[a.kind] != null ? kindOrder[a.kind] : 9;
      const bo = kindOrder[b.kind] != null ? kindOrder[b.kind] : 9;
      if (ao !== bo) return ao - bo;
      return String(a.heroName).localeCompare(String(b.heroName));
    });
    if (sortedRows.length > 0 && turnNumbers.length > 0) {
      details.appendChild(el('p', { style: 'font-weight:600;margin:12px 0 2px 0;font-size:12.5px;' }, [
        document.createTextNode('スキル発動タイムライン(色つきセル=そのターンに発動中)'),
        el('button', { type: 'button', class: 'info-icon', 'data-info': 'timeline-legend', title: '見方について', text: 'i' }),
        // 【v4.30】「横にスクロールしない」というご指摘への対応。表自体はCSS上スクロール可能だったが、
        // マウスホイールでの直感的な横スクロールができず(スクロールバーを直接ドラッグする必要があった)、
        // わかりにくかったための追記。実際のスクロール方法自体はsetupTimelineWheelScroll()側で
        // マウスホイール操作を横スクロールに変換することで対応済み。
        el('span', { text: '(マウスホイールで横スクロールできます)', style: 'font-weight:400;color:var(--muted);margin-left:6px;' }),
      ]));
      const tlWrap = el('div', { class: 'mini-table timeline-table' });
      const tlTable = el('table');
      const theadRow = el('tr');
      theadRow.appendChild(el('th', { text: 'スキル', style: 'text-align:left;' }));
      turnNumbers.forEach(t => theadRow.appendChild(el('th', { text: String(t) })));
      const thead = el('thead'); thead.appendChild(theadRow);
      tlTable.appendChild(thead);
      const tlBody = el('tbody');
      const cellColorFor = (kind) => {
        if (CONST_KINDS.has(kind)) return '#10b981'; // 緑: 常時発動(遠征スキル/専用装備スキル/敵デバフ)
        if (kind === 'periodic') return '#38bdf8'; // 水色: 周期発動
        return '#fb923c'; // オレンジ: 確率発動
      };
      sortedRows.forEach(row => {
        const tr = el('tr');
        const kindLabel = KIND_LABEL[row.kind] || row.kind;
        // 【v4.31】fmtOneSkill同様、英語名の括弧併記を廃止(和名判明分は和名のみ、未確認分は英語名のみ表示)。
        const displayName = row.skillNameJa || row.skillName;
        const nameSuffix = displayName ? `:${displayName}` : '';
        const chanceSuffix = row.kind === 'proc' ? `(確率${Math.round((row.chance || 0) * 100)}%)` : '';
        const label = `[${row.sideLabel}] ${shortHeroName(row.heroName)}[${kindLabel}${nameSuffix}]${chanceSuffix}`;
        tr.appendChild(el('td', { text: label, style: 'text-align:left;white-space:nowrap;' }));
        const color = cellColorFor(row.kind);
        turnNumbers.forEach(t => {
          const active = row.turns.has(t);
          const cellStyle = active
            ? `background:${color};color:#04141c;font-weight:600;text-align:center;`
            : 'text-align:center;color:#3a4863;';
          tr.appendChild(el('td', { text: active ? '●' : '·', style: cellStyle }));
        });
        tlBody.appendChild(tr);
      });
      tlTable.appendChild(tlBody);
      tlWrap.appendChild(tlTable);
      details.appendChild(tlWrap);
    } else {
      details.appendChild(el('p', { text: '(このパターンでは英雄が選択されていないため、表示できるスキルがありません)', style: 'font-size:12px;color:var(--muted);margin:10px 0 0 0;' }));
    }
    card.appendChild(details);

    const heroLogDetails = el('details', { style: 'margin-top:6px;' });
    heroLogDetails.appendChild(el('summary', { text: '適用された英雄バフの内訳', style: 'cursor:pointer;font-size:12.5px;color:var(--accent-bright);' }));
    const logDiv = el('div', { class: 'hero-log' });
    const fmtLogLine = (side, l) => {
      const roleLabel = l.role ? `/${TYPE_LABEL[l.role]}担当` : '';
      // 【v4.31】以前はこの欄(裏取り根拠を確認する詳細欄)だけは、出典(wostools.net等)との
      // 突き合わせをしやすくするため和名に加え英語名も併記していたが、「スキル名の横の英語表記は
      // 不要」というご指摘を受け、他の箇所と統一して和名(判明分)のみを表示するようにした
      // (和名が未確認の場合は代わりに英語名を表示。英語名で出典と突き合わせたい場合は、
      // heroes-data.js内のコメントに調査時の英語名・出典を引き続き記載している)。
      const skillLabel = l.skillNameJa
        ? `[${l.skillNameJa}]`
        : (l.skillName ? `[${l.skillName}]` : '');
      return `[${side}${roleLabel}] ${l.heroName}${skillLabel} - ${l.kind}: ${l.scope === 'all' ? '全部隊' : TYPE_LABEL[l.scope]}の${l.stat} ${l.pct >= 0 ? '+' : ''}${l.pct.toFixed(1)}%`;
    };
    (res.heroLogs[selfKey] || []).forEach(l => logDiv.appendChild(el('div', { text: fmtLogLine('自軍', l) })));
    (res.heroLogs[enemyKey] || []).forEach(l => logDiv.appendChild(el('div', { text: fmtLogLine('敵軍', l) })));
    heroLogDetails.appendChild(logDiv);
    card.appendChild(heroLogDetails);

    if (reqMult) {
      const box = el('div', { class: 'req-mult-box' });
      box.textContent = reqMult.found
        ? `必要兵力倍率(目安): 現在の兵種比率のまま 約 ${reqMult.multiplier.toFixed(2)} 倍 で、${selfIsAttacker ? '占領できる' : '守り切れる'}計算です。`
        : reqMult.message;
      card.appendChild(box);
    }
    return card;
  }

  // 実際のゲーム内ログには「ターン数」という概念が存在しない(発動回数・キル数・生存数などのみ)ため、
  // これは本ツール内部の計算用の刻み幅を決めるための固定基準値。この値を変えても勝敗・残存兵力・
  // 必要兵力倍率などの結果には影響しない(ターン別推移の刻み方のみ変わる)。
  const CALIBRATION_TARGET_TURNS = 60;
  // v4.32でユーザー向けの「シミュレーション最大ターン数(安全装置)」入力欄を廃止し、どちらかの兵科が
  // 全滅するまで(=決着がつくまで)自動的にシミュレーションを続ける仕様に変更した。ただし、極端な入力値
  // (両軍が完全に拮抗し続ける等)でブラウザが無応答になることを避けるための内部専用の安全上限として、
  // 十分に大きな値を残している(通常の対戦ではまず到達しない値)。
  const INTERNAL_SAFETY_MAX_TURNS = 200000;

  function buildOpts() {
    const mech = readMech();
    const targetTurns = CALIBRATION_TARGET_TURNS;
    const maxTurns = INTERNAL_SAFETY_MAX_TURNS;
    // キャリブレーションは敵軍側のTier/火晶を基準点として使う(役割に関わらず一貫した基準にするため)。
    // v4.7で兵科ごとに個別のTier/火晶入力になったため、3兵科の平均値を基準点として用いる
    // (この基準値は内部の倍率換算にのみ使われ、勝敗・残存兵力・必要兵力倍率などの結果自体には
    // 影響しない)。
    const defLv = {}, defFc = {};
    ORDER.forEach(t => { defLv[t] = getNum(`defender-lv-${t}`, 10); defFc[t] = getNum(`defender-fc-${t}`, 7); });
    const avgLv = (defLv.shield + defLv.spear + defLv.archer) / 3;
    const avgFc = (defFc.shield + defFc.spear + defFc.archer) / 3;
    const baselineForCalib = { lv: { shield: avgLv, spear: avgLv, archer: avgLv }, fc: avgFc };
    const scale = SimCore.calibrateScale(baselineForCalib, baselineForCalib, targetTurns, mech);
    return { maxTurns, scale, mech };
  }

  // パターンBに兵力の入力が一切ない(盾兵・槍兵・弓兵の兵力数がすべて0)場合、
  // 「入力なし」とみなしてパターンBの結果は表示しない。
  function hasAnyTroops(config) {
    return (config.counts.shield || 0) + (config.counts.spear || 0) + (config.counts.archer || 0) > 0;
  }

  // ---------------- 実際の乱数を使った複数回試行(モンテカルロ、v4.14〜v4.15) ----------------
  // 「同じ設定なら次回も同じ結果になるのはなぜか、確率発動スキルがあるなら結果もばらつくはずでは」
  // というご指摘に対応。v4.15では通常の「シミュレーション実行」自体も毎回新しい乱数を引くように
  // 変更した(runAndRender参照)ため、1回1回の実行はすでに「その回の巡り合わせ」を反映した結果になる。
  // この「複数回試行」機能は、それとは別に、N回分の巡り合わせをまとめて集計し、勝率・損耗数が
  // 平均的にどのくらいの幅(最小〜最大)に収まるのかという統計的な傾向を確認するためのもの。
  function fmtStat(s) {
    return `平均${fmt(s.avg)} (最小${fmt(s.min)}〜最大${fmt(s.max)})`;
  }
  function renderMonteCarloBlock(label, mc) {
    const box = el('div', { class: 'card', style: 'margin-top:8px;padding:12px;' });
    // v4.18: 比較対象(パターンB)が無効なときはlabelが空文字になるため、その場合は「N回試行」のみ表示する。
    box.appendChild(el('p', { text: label ? `${label}: ${mc.trials}回試行` : `${mc.trials}回試行`, style: 'font-weight:600;margin:0 0 6px 0;' }));
    const winPct = (mc.winRate.attacker * 100).toFixed(1);
    const losePct = (mc.winRate.defender * 100).toFixed(1);
    const undecidedPct = (mc.winRate.undecidedOrDraw * 100).toFixed(1);
    box.appendChild(el('div', {
      text: `攻撃側勝利: ${winPct}% / 防衛側勝利: ${losePct}%${mc.winRate.undecidedOrDraw > 0 ? ` / 未決着: ${undecidedPct}%` : ''}`,
      style: 'font-size:13px;margin-bottom:6px;'
    }));
    const table = el('table', { class: 'stat-table' });
    const thead = el('thead');
    thead.innerHTML = '<tr><th></th><th>盾兵</th><th>槍兵</th><th>弓兵</th></tr>';
    table.appendChild(thead);
    const tbody = el('tbody');
    const rowFor = (rowLabel, stats) => {
      const tr = el('tr');
      tr.appendChild(el('td', { text: rowLabel, style: 'white-space:nowrap;font-weight:600;' }));
      ORDER.forEach(t => tr.appendChild(el('td', { text: fmtStat(stats[t]), style: 'font-size:12px;' })));
      return tr;
    };
    tbody.appendChild(rowFor('自軍損耗', mc.attackerLossStats));
    tbody.appendChild(rowFor('敵軍損耗', mc.defenderLossStats));
    table.appendChild(tbody);
    box.appendChild(table);
    return box;
  }
  function runMonteCarlo() {
    const opts = buildOpts();
    const enemyConfig = readSideConfig('defender');
    const configA = readSideConfig('A');
    const configB = readSideConfig('B');
    const selfIsAttacker = selfMode() === 'attack';
    const showB = isPatternBEnabled() && hasAnyTroops(configB);
    const trials = Math.max(10, Math.min(2000, getNum('monte-carlo-trials', 200)));
    // baseSeedは呼び出しのたびに変える(Math.random())。これにより「実行するたびに実際に違う
    // 乱数サンプルを引く」ことになり、複数回このボタンを押すと(統計的な範囲内で)違う結果が出る。
    const baseSeed = Math.random();

    const resultBox = document.getElementById('monte-carlo-result');
    resultBox.innerHTML = '';
    resultBox.style.display = 'block';
    resultBox.appendChild(el('p', { text: '計算中...', style: 'font-size:13px;color:var(--muted);' }));

    // 同期計算だが、先に「計算中」を描画させるためわずかに遅延させる。
    setTimeout(() => {
      resultBox.innerHTML = '';
      const mcA = selfIsAttacker
        ? SimCore.runBattleMonteCarlo(configA, enemyConfig, HEROES, opts, trials, baseSeed + '_A')
        : SimCore.runBattleMonteCarlo(enemyConfig, configA, HEROES, opts, trials, baseSeed + '_A');
      // selfが防衛側の場合、Monte Carlo結果のattacker/defenderは実際には敵軍/自軍に対応するため、
      // 表示側は「自軍損耗」「敵軍損耗」の向きに合わせて読み替える。
      const adaptForSelf = (mc) => selfIsAttacker ? mc : {
        trials: mc.trials,
        winRate: { attacker: mc.winRate.defender, defender: mc.winRate.attacker, undecidedOrDraw: mc.winRate.undecidedOrDraw },
        attackerLossStats: mc.defenderLossStats,
        defenderLossStats: mc.attackerLossStats,
      };
      const mcAForSelf = adaptForSelf(mcA);
      resultBox.appendChild(renderMonteCarloBlock(showB ? 'パターンA' : '', mcAForSelf));
      let mcBForSelf = null;
      if (showB) {
        const mcB = selfIsAttacker
          ? SimCore.runBattleMonteCarlo(configB, enemyConfig, HEROES, opts, trials, baseSeed + '_B')
          : SimCore.runBattleMonteCarlo(enemyConfig, configB, HEROES, opts, trials, baseSeed + '_B');
        mcBForSelf = adaptForSelf(mcB);
        resultBox.appendChild(renderMonteCarloBlock('パターンB', mcBForSelf));
      }
      // 【v4.32】PDFレポートの勝率セクション用に、直近の複数回試行結果を保持しておく。
      lastMonteCarloData = { showB, mcA: mcAForSelf, mcB: mcBForSelf };
    }, 10);
  }

  function runAndRender(withMultiplier) {
    lastMonteCarloData = null; // 入力値が変わっている可能性があるため、直近の複数回試行結果は破棄する
    const opts = buildOpts();
    // 【v4.15】「シミュレーション結果もつど(実行するたびに)ばらつくはずだろ」というご指摘に対応。
    // v4.14まではtrialSeedを既定値0に固定しており、この「シミュレーション実行」ボタン自体は
    // 何度押しても常に同じ結果になっていた(確率発動スキルの発動判定が毎回同じだったため)。
    // v4.15では、ボタンを押すたびにMath.random()で新しいtrialSeedを引くようにし、実行するたびに
    // (実際のゲームと同じように)結果が変わるようにした。ただし1回の実行(1回のボタンクリック)の中では、
    // パターンA・B・必要兵力倍率の二分探索(内部で兵力を変えながら何度もrunBattleを呼ぶ)のすべてで
    // 同じtrialSeedを使う。これは、①パターンA/Bを同じ「その回の巡り合わせ」で公平に比較するため、
    // ②必要兵力倍率の二分探索は、trialSeedさえ固定していれば兵力を増やすほど有利になるという
    // 単調性が保たれ安定して収束するため(trialSeedは兵力数やターン数に依存しないキーで乱数を
    // 決めているため、探索対象のmを変えても発動パターン自体は変わらない)。
    opts.trialSeed = Math.random();
    const enemyConfig = readSideConfig('defender');
    const configA = readSideConfig('A');
    const configB = readSideConfig('B');
    const selfIsAttacker = selfMode() === 'attack';
    // v4.13: 「Bパターンを使う」がチェックされている場合のみBパターンを計算・表示対象にする
    // (未チェックならBの入力欄自体が非表示になっているため、兵力が入っていても無視する)。
    const showB = isPatternBEnabled() && hasAnyTroops(configB);

    // runBattle(attacker, defender, ...) の引数順に合わせて、自軍/敵軍のどちらが攻撃側かを割り当てる
    const resA = selfIsAttacker ? SimCore.runBattle(configA, enemyConfig, HEROES, opts) : SimCore.runBattle(enemyConfig, configA, HEROES, opts);
    const resB = showB ? (selfIsAttacker ? SimCore.runBattle(configB, enemyConfig, HEROES, opts) : SimCore.runBattle(enemyConfig, configB, HEROES, opts)) : null;

    let multA = null, multB = null;
    if (withMultiplier) {
      // 必要兵力倍率は「自軍を何倍すれば勝てるか」なので、自軍が攻撃側でない場合は逆転させて解釈する
      if (selfIsAttacker) {
        multA = SimCore.findRequiredMultiplier(configA, enemyConfig, HEROES, opts, { minM: 0.1, maxM: 20, iterations: 24 });
        if (showB) multB = SimCore.findRequiredMultiplier(configB, enemyConfig, HEROES, opts, { minM: 0.1, maxM: 20, iterations: 24 });
      } else {
        // 自軍が防衛側の場合、「敵の兵力を何倍にしても自軍が守り切れる倍率」を、敵軍側をスケールして求める
        multA = SimCore.findRequiredMultiplier(enemyConfig, configA, HEROES, opts, { minM: 0.1, maxM: 20, iterations: 24 });
        if (multA.found) multA = Object.assign({}, multA, { message: `敵軍の兵力が約${multA.multiplier.toFixed(2)}倍になるまでは守り切れる計算です。` });
        if (showB) {
          multB = SimCore.findRequiredMultiplier(enemyConfig, configB, HEROES, opts, { minM: 0.1, maxM: 20, iterations: 24 });
          if (multB.found) multB = Object.assign({}, multB, { message: `敵軍の兵力が約${multB.multiplier.toFixed(2)}倍になるまでは守り切れる計算です。` });
        }
      }
    }

    const grid = document.getElementById('result-grid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = showB ? '' : 'minmax(0,1fr)';
    grid.appendChild(renderResultCard(showB ? 'パターンA' : '', resA, multA, selfIsAttacker));
    if (showB) grid.appendChild(renderResultCard('パターンB', resB, multB, selfIsAttacker));
    document.getElementById('result-card').style.display = 'block';

    // 【v4.28】PDFレポート出力機能のため、直近の実行結果一式を保持しておく(ボタンを押した時点で
    // 再計算するのではなく、画面に表示されているのと同じ結果をそのままレポート化するため)。
    lastRunData = { resA, resB, showB, selfIsAttacker, multA, multB, configA, configB, enemyConfig };
  }

  // ---------------- PDFレポート出力(v4.28) ----------------
  // 「シミュレーター本体にPDF出力機能を追加してほしい、グラフも欲しい」というご依頼への対応。
  // jsPDF等の外部ライブラリは追加せず(単体HTML・依存最小という方針を維持)、ブラウザ標準の印刷機能
  // (window.print())を利用した「印刷専用セクション」方式にした。#pdf-reportというコンテナに
  // レポート内容を組み立てて表示し、それ以外の画面要素は@media print側でvisibility:hiddenにする
  // (shell.html側のCSS参照)。印刷ダイアログの出力先で「PDFに保存」を選べば、そのままPDFファイルとして
  // 保存できる(Chrome/Edge/Safari等、主要ブラウザが標準搭載している機能)。
  // グラフはCanvas 2D APIで自前描画し、toDataURL()でPNG化して<img>として埋め込む(printでcanvasの
  // 再描画に依存させないための処置)。配色はdata-vizガイドラインの検証済み値を使用
  // (盾兵=blue #2a78d6 / 槍兵=orange #eb6834 / 弓兵=aqua #1baf7a。ライト背景[印刷用紙を想定]での
  // カラーユニバーサルデザイン[CVD]適性・コントラストをvalidate_palette.jsで確認済み)。
  let lastRunData = null;
  // 【v4.32】「実際の乱数で複数回試行」の直近の結果(PDFレポートの勝率セクション用)。
  // 通常の「シミュレーション実行」を行うと、入力値が変わった可能性があるため一旦nullに戻す
  // (試行結果が現在の設定とズレたままレポートに載ってしまうのを防ぐため)。
  let lastMonteCarloData = null;

  const CHART_COLOR = { shield: '#2a78d6', spear: '#eb6834', archer: '#1baf7a' };
  const CHART_GRID = '#e3e2dd';
  const CHART_AXIS = '#b9b8b2';
  const CHART_TEXT_MUTED = '#52514e';
  const CHART_TEXT_DARK = '#0b0b0b';
  const STATUS_GOOD = '#0ca30c';
  const STATUS_CRIT = '#d03b3b';

  function makeChartCanvas(w, h) {
    const dpr = 2; // 印刷時も荒れないよう2倍解像度で描画してからPNG化する
    const canvas = document.createElement('canvas');
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    return { canvas, ctx, w, h };
  }
  function chartToImg(chart, alt) {
    const img = el('img', { class: 'chart-img', alt: alt || '' });
    img.src = chart.canvas.toDataURL('image/png');
    img.width = chart.w;
    img.height = chart.h;
    return img;
  }
  // y軸目盛りをきりのいい数に丸める(1/2/5/10 × 10^n)
  function niceCeil(v) {
    if (!(v > 0)) return 1;
    const exp = Math.floor(Math.log10(v));
    const base = Math.pow(10, exp);
    const n = v / base;
    let niceN;
    if (n <= 1) niceN = 1; else if (n <= 2) niceN = 2; else if (n <= 5) niceN = 5; else niceN = 10;
    return niceN * base;
  }
  function drawRoundTopRect(ctx, x, y, w, h, r) {
    if (h <= 0 || w <= 0) return;
    r = Math.max(0, Math.min(r, w / 2, h));
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();
  }
  // グループ化棒グラフ(カテゴリ×兵科3種)。残存兵力・損耗数の両方で使う共通描画関数。
  function drawGroupedBarChart(categories, dataByCategory) {
    const w = 640, h = 260;
    const chart = makeChartCanvas(w, h);
    const ctx = chart.ctx;
    const padL = 60, padR = 16, padT = 14, padB = 30;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    let maxVal = 0;
    categories.forEach(cat => ORDER.forEach(t => { maxVal = Math.max(maxVal, dataByCategory[cat][t] || 0); }));
    const niceMax = niceCeil(maxVal);
    const yTicks = 4;
    ctx.clearRect(0, 0, w, h);
    ctx.lineWidth = 1;
    for (let i = 0; i <= yTicks; i++) {
      const val = niceMax * i / yTicks;
      const y = padT + plotH - (val / (niceMax || 1)) * plotH;
      ctx.strokeStyle = CHART_GRID;
      ctx.beginPath(); ctx.moveTo(padL, y + 0.5); ctx.lineTo(padL + plotW, y + 0.5); ctx.stroke();
      ctx.fillStyle = CHART_TEXT_MUTED; ctx.font = '11px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(fmt(val), padL - 8, y);
    }
    const groupW = plotW / categories.length;
    const barGap = 3, barMax = 26;
    let barW = Math.min(barMax, (groupW * 0.62 - barGap * (ORDER.length - 1)) / ORDER.length);
    if (barW < 4) barW = 4;
    const groupInnerW = barW * ORDER.length + barGap * (ORDER.length - 1);
    categories.forEach((cat, ci) => {
      const groupX = padL + groupW * ci + (groupW - groupInnerW) / 2;
      ORDER.forEach((t, si) => {
        const val = dataByCategory[cat][t] || 0;
        const barH = niceMax > 0 ? (val / niceMax) * plotH : 0;
        const x = groupX + si * (barW + barGap);
        const y = padT + plotH - barH;
        ctx.fillStyle = CHART_COLOR[t];
        drawRoundTopRect(ctx, x, y, barW, barH, 3);
        if (barH > 12) {
          ctx.fillStyle = CHART_TEXT_DARK; ctx.font = '9.5px sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.fillText(fmt(val), x + barW / 2, y - 2);
        }
      });
      ctx.fillStyle = CHART_TEXT_DARK; ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(cat, padL + groupW * ci + groupW / 2, padT + plotH + 8);
    });
    ctx.strokeStyle = CHART_AXIS;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.lineTo(padL + plotW, padT + plotH); ctx.stroke();
    return chart;
  }
  // ターン別の推移を折れ線で描く(自軍/敵軍など複数系列対応)
  function drawLineChart(xLabels, seriesList) {
    const w = 640, h = 260;
    const chart = makeChartCanvas(w, h);
    const ctx = chart.ctx;
    const padL = 60, padR = 90, padT = 14, padB = 26;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    let maxVal = 0;
    seriesList.forEach(s => s.values.forEach(v => { maxVal = Math.max(maxVal, v); }));
    const niceMax = niceCeil(maxVal);
    const yTicks = 4;
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i <= yTicks; i++) {
      const val = niceMax * i / yTicks;
      const y = padT + plotH - (val / (niceMax || 1)) * plotH;
      ctx.strokeStyle = CHART_GRID; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, y + 0.5); ctx.lineTo(padL + plotW, y + 0.5); ctx.stroke();
      ctx.fillStyle = CHART_TEXT_MUTED; ctx.font = '11px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(fmt(val), padL - 8, y);
    }
    const n = xLabels.length;
    const xStep = n > 1 ? plotW / (n - 1) : 0;
    const xTickEvery = Math.max(1, Math.ceil(n / 8));
    ctx.fillStyle = CHART_TEXT_DARK; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    xLabels.forEach((lb, i) => {
      if (i % xTickEvery === 0 || i === n - 1) ctx.fillText(String(lb), padL + xStep * i, padT + plotH + 6);
    });
    seriesList.forEach(s => {
      ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      s.values.forEach((v, i) => {
        const x = padL + xStep * i, y = padT + plotH - (niceMax > 0 ? (v / niceMax) * plotH : 0);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      const lastI = s.values.length - 1;
      const lx = padL + xStep * lastI, ly = padT + plotH - (niceMax > 0 ? (s.values[lastI] / niceMax) * plotH : 0);
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(lx, ly, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(lx, ly, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = CHART_TEXT_DARK; ctx.font = '11px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(`${s.label} ${fmt(s.values[lastI])}`, lx + 8, ly);
    });
    ctx.strokeStyle = CHART_AXIS;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.lineTo(padL + plotW, padT + plotH); ctx.stroke();
    return chart;
  }
  // 勝率(実際の乱数による複数回試行)を示す棒グラフ。PDFレポートに勝率を載せてほしいというご要望
  // (v4.32)への対応。「実際の乱数で複数回試行」ボタンの結果(lastMonteCarloData)がある場合のみ、
  // レポートの各パターンの結果セクションに追加で表示する。
  function drawWinRateChart(mc) {
    const w = 420, h = 220;
    const chart = makeChartCanvas(w, h);
    const ctx = chart.ctx;
    const padL = 44, padR = 16, padT = 14, padB = 30;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    const niceMax = 100;
    const yTicks = 4;
    ctx.clearRect(0, 0, w, h);
    ctx.lineWidth = 1;
    for (let i = 0; i <= yTicks; i++) {
      const val = niceMax * i / yTicks;
      const y = padT + plotH - (val / niceMax) * plotH;
      ctx.strokeStyle = CHART_GRID;
      ctx.beginPath(); ctx.moveTo(padL, y + 0.5); ctx.lineTo(padL + plotW, y + 0.5); ctx.stroke();
      ctx.fillStyle = CHART_TEXT_MUTED; ctx.font = '11px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(`${val}%`, padL - 8, y);
    }
    const cats = [
      { label: '勝利', val: mc.winRate.attacker * 100, color: STATUS_GOOD },
      { label: '敗北', val: mc.winRate.defender * 100, color: STATUS_CRIT },
    ];
    if (mc.winRate.undecidedOrDraw > 0) cats.push({ label: '未決着', val: mc.winRate.undecidedOrDraw * 100, color: '#9a9890' });
    const groupW = plotW / cats.length;
    const barW = Math.min(60, groupW * 0.5);
    cats.forEach((c, i) => {
      const x = padL + groupW * i + (groupW - barW) / 2;
      const barH = (c.val / niceMax) * plotH;
      const y = padT + plotH - barH;
      ctx.fillStyle = c.color;
      drawRoundTopRect(ctx, x, y, barW, barH, 3);
      ctx.fillStyle = CHART_TEXT_DARK; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(`${c.val.toFixed(1)}%`, x + barW / 2, y - 3);
      ctx.font = '12px sans-serif'; ctx.textBaseline = 'top';
      ctx.fillText(c.label, padL + groupW * i + groupW / 2, padT + plotH + 8);
    });
    ctx.strokeStyle = CHART_AXIS;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.lineTo(padL + plotW, padT + plotH); ctx.stroke();
    return chart;
  }
  function legendRow(items) {
    const wrap = el('div', { class: 'legend' });
    items.forEach(it => {
      const span = el('span');
      span.appendChild(el('i', { style: `background:${it.color};` }));
      span.appendChild(document.createTextNode(it.label));
      wrap.appendChild(span);
    });
    return wrap;
  }
  function heroDisplayName(entry) {
    if (!entry || !entry.heroKey) return '(未選択)';
    const h = HEROES[entry.heroKey];
    return h ? h.name : entry.heroKey;
  }
  function buildConfigSummaryTable(selfLabel, enemyLabel, cfg, enemyCfg) {
    const table = el('table');
    table.innerHTML = `<thead><tr><th></th><th class="type-shield">盾兵</th><th class="type-spear">槍兵</th><th class="type-archer">弓兵</th></tr></thead>`;
    const tbody = el('tbody');
    const addRow = (label2, cfgObj, rowFn) => {
      const tr = el('tr'); tr.appendChild(el('td', { text: label2 }));
      ORDER.forEach(t => tr.appendChild(el('td', { text: rowFn(cfgObj, t) })));
      tbody.appendChild(tr);
    };
    addRow(`${selfLabel} 兵力数`, cfg, (c, t) => fmt(c.counts[t]));
    addRow(`${selfLabel} Tier/火晶Lv`, cfg, (c, t) => `T${Number(c.lv[t]).toFixed(1)} / Lv${c.fc[t]}`);
    addRow(`${selfLabel} 担当英雄(装備Lv)`, cfg, (c, t) => {
      const entry = c.heroes[t]; const name = heroDisplayName(entry);
      return name === '(未選択)' ? name : `${name} (Lv${entry.eqLv})`;
    });
    addRow(`${enemyLabel} 兵力数`, enemyCfg, (c, t) => fmt(c.counts[t]));
    addRow(`${enemyLabel} Tier/火晶Lv`, enemyCfg, (c, t) => `T${Number(c.lv[t]).toFixed(1)} / Lv${c.fc[t]}`);
    addRow(`${enemyLabel} 担当英雄(装備Lv)`, enemyCfg, (c, t) => {
      const entry = c.heroes[t]; const name = heroDisplayName(entry);
      return name === '(未選択)' ? name : `${name} (Lv${entry.eqLv})`;
    });
    table.appendChild(tbody);
    return table;
  }
  // 1パターン(A or B)分のレポートセクションを組み立てる。mcは「実際の乱数で複数回試行」の結果
  // (省略可。直近に試行していれば渡され、勝率セクションが追加される)。
  function buildPatternReportSection(patternLabel, res, selfIsAttacker, cfg, enemyConfig, mc) {
    const selfKey = selfIsAttacker ? 'attacker' : 'defender';
    const enemyKey = selfIsAttacker ? 'defender' : 'attacker';
    const sec = el('div', { style: 'margin-bottom:26px;' });
    if (patternLabel) sec.appendChild(el('h2', { text: patternLabel }));

    const w = WINNER_LABEL[res.winner] || WINNER_LABEL.undecided;
    const isWin = res.winner === (selfIsAttacker ? 'attacker' : 'defender');
    const isLose = res.winner === (selfIsAttacker ? 'defender' : 'attacker');
    const badge = el('p', { style: `font-weight:800;font-size:14px;color:${isWin ? STATUS_GOOD : (isLose ? STATUS_CRIT : CHART_TEXT_MUTED)};` }, [
      document.createTextNode(`結果: ${w.text}`),
    ]);
    sec.appendChild(badge);

    if (mc) {
      const winPct = (mc.winRate.attacker * 100).toFixed(1);
      const losePct = (mc.winRate.defender * 100).toFixed(1);
      sec.appendChild(el('h3', { text: `勝率(実際の乱数による${mc.trials}回試行)` }));
      sec.appendChild(el('p', {
        text: `勝利: ${winPct}% / 敗北: ${losePct}%${mc.winRate.undecidedOrDraw > 0 ? ` / 未決着: ${(mc.winRate.undecidedOrDraw * 100).toFixed(1)}%` : ''}(自軍から見た表記)`,
        style: 'font-size:12.5px;margin:0 0 6px 0;',
      }));
      sec.appendChild(chartToImg(drawWinRateChart(mc), '勝率グラフ'));
    }

    sec.appendChild(el('h3', { text: '対戦条件' }));
    sec.appendChild(buildConfigSummaryTable('自軍', '敵軍', cfg, enemyConfig));

    // 残存兵力・損耗数のグループ化棒グラフ
    const remData = {
      '自軍': res.remaining[selfKey],
      '敵軍': res.remaining[enemyKey],
    };
    const lossData = {
      '自軍': res.losses[selfKey],
      '敵軍': res.losses[enemyKey],
    };
    const legendItems = ORDER.map(t => ({ color: CHART_COLOR[t], label: TYPE_LABEL[t] }));

    sec.appendChild(el('h3', { text: '残存兵力' }));
    sec.appendChild(legendRow(legendItems));
    sec.appendChild(chartToImg(drawGroupedBarChart(['自軍', '敵軍'], remData), '残存兵力グラフ'));

    sec.appendChild(el('h3', { text: '損耗数' }));
    sec.appendChild(legendRow(legendItems));
    sec.appendChild(chartToImg(drawGroupedBarChart(['自軍', '敵軍'], lossData), '損耗数グラフ'));

    // ターン別 累積損耗の推移(自軍合計 vs 敵軍合計)
    const history = res.history || [];
    if (history.length > 0) {
      let selfCum = 0, enemyCum = 0;
      const selfSeries = [], enemySeries = [], turnLabels = [];
      history.forEach(h => {
        const selfLoss = selfIsAttacker ? h.attackerLosses : h.defenderLosses;
        const enemyLoss = selfIsAttacker ? h.defenderLosses : h.attackerLosses;
        selfCum += (selfLoss.shield + selfLoss.spear + selfLoss.archer);
        enemyCum += (enemyLoss.shield + enemyLoss.spear + enemyLoss.archer);
        selfSeries.push(selfCum);
        enemySeries.push(enemyCum);
        turnLabels.push(h.turn);
      });
      sec.appendChild(el('h3', { text: 'ターン別 累積損耗数の推移' }));
      sec.appendChild(legendRow([{ color: CHART_COLOR.shield, label: '自軍 累積損耗' }, { color: STATUS_CRIT, label: '敵軍 累積損耗(=自軍キル数)' }]));
      sec.appendChild(chartToImg(drawLineChart(turnLabels, [
        { label: '自軍', color: CHART_COLOR.shield, values: selfSeries },
        { label: '敵軍', color: STATUS_CRIT, values: enemySeries },
      ]), 'ターン別累積損耗グラフ'));
    }

    // 常時発動しているスキル(遠征スキル/専用装備スキル/敵デバフ)
    sec.appendChild(el('h3', { text: '常時発動しているスキル(遠征スキル/専用装備スキル/敵デバフ)' }));
    const selfConstList = (res.sideConstants && res.sideConstants[selfKey]) || [];
    const enemyConstList = (res.sideConstants && res.sideConstants[enemyKey]) || [];
    const constWrap = el('div', { style: 'display:flex;gap:24px;flex-wrap:wrap;font-size:12.5px;' });
    constWrap.appendChild(buildSkillGroup('自軍:', selfConstList));
    constWrap.appendChild(buildSkillGroup('敵軍:', enemyConstList));
    sec.appendChild(constWrap);

    return sec;
  }
  function buildPdfReportContent(container) {
    container.innerHTML = '';
    const now = new Date();
    const dateStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    container.appendChild(el('h1', { text: '遠征戦闘シミュレーター 分析レポート' }));
    container.appendChild(el('p', { class: 'meta', text: `出力日時: ${dateStr}` }));

    const d = lastRunData;
    // 【v4.32】「実際の乱数で複数回試行」を直近に行っていれば(かつパターンB表示状況が一致していれば)、
    // その勝率をレポートにも含める。入力を変えて「シミュレーション実行」をやり直すとlastMonteCarloDataは
    // nullに戻るため、現在の結果とズレた勝率が載ることはない。
    const mc = lastMonteCarloData;
    const mcMatches = mc && mc.showB === d.showB;
    container.appendChild(buildPatternReportSection(d.showB ? 'パターンA' : '', d.resA, d.selfIsAttacker, d.configA, d.enemyConfig, mcMatches ? mc.mcA : null));
    if (d.showB) {
      container.appendChild(buildPatternReportSection('パターンB', d.resB, d.selfIsAttacker, d.configB, d.enemyConfig, mcMatches ? mc.mcB : null));
    }

    container.appendChild(el('p', { class: 'footnote', text: '本レポートは「遠征戦闘シミュレーター」上で入力した設定値・計算モデルに基づく試算であり、実際の戦闘結果を保証するものではありません。兵科基礎ステータス等の裏取り状況については、ツール本体の各infoアイコンの説明をご参照ください。' }));
  }
  function setupPdfReport() {
    const btn = document.getElementById('btn-pdf-report');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      if (!lastRunData) {
        alert('先に「シミュレーション実行」を行ってから、PDFレポートを出力してください。');
        return;
      }
      const container = document.getElementById('pdf-report');
      buildPdfReportContent(container);
      // 【v4.32】グラフ(canvas.toDataURL()で生成した<img>)の描画(デコード)完了を待ってから
      // 印刷を開始する。直後にwindow.print()を呼ぶと、環境によってはブラウザ側の画像デコードが
      // 完了する前に印刷内容が確定してしまい、グラフ部分が空白のまま出力されることがあるための対策。
      const imgs = Array.from(container.querySelectorAll('img.chart-img'));
      await Promise.all(imgs.map(img => (img.decode ? img.decode().catch(() => {}) : Promise.resolve())));
      // 画像デコード後、描画フレームが実際に反映されるまでもう一呼吸待つ
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      window.print();
    });
  }

  // ---------------- スキル発動タイムラインの横スクロール対応(v4.30) ----------------
  // 「スキル発動のタイムラインが横にスクロールしない」というご指摘への対応。タイムライン表
  // (.timeline-table、1行=1スキル・1列=1ターン)自体はCSS上(.mini-table { overflow:auto; })
  // 横スクロール可能な実装になっていたが、一般的なマウスホイール操作(縦方向のホイール)では
  // 横方向にスクロールされず、実際にスクロールするには専用のスクロールバーを直接ドラッグするか
  // Shift+ホイールを使う必要があった。これは多くの利用者にとって分かりにくく、事実上「スクロール
  // できない」ように見える原因だった。
  // ここでは、マウスホイールの縦方向の操作(deltaY)を、この表の横スクロール(scrollLeft)に
  // 変換することで、直感的にマウスホイールだけで全ターン分を見られるようにした。対象を
  // .timeline-table(1行=1スキルの表。行数が少なく縦スクロールの必要性は低い)に限定しており、
  // ターン別の損耗数だけを表示する通常の.mini-table(1行=1ターンで縦に伸びる表)は対象にしていない
  // (そちらは従来通り縦スクロールを優先する)。
  function setupTimelineWheelScroll() {
    document.addEventListener('wheel', (e) => {
      const tl = e.target.closest('.timeline-table');
      if (!tl) return;
      if (tl.scrollWidth <= tl.clientWidth) return; // 横に伸びていない(スクロールの必要がない)場合は何もしない
      if (e.deltaY === 0) return;
      tl.scrollLeft += e.deltaY;
      e.preventDefault();
    }, { passive: false });
  }

  // ---------------- 保存/読込 ----------------
  function collectFullState() {
    return {
      scenario: getScenario(),
      mech: {
        counter: getNum('mech-counter', 10),
        // v4.16: scalingExponent(兵力数のダメージ寄与指数)は入力欄ごと廃止し、平方根モデル(0.5)に
        // 固定した(readMech参照)。旧バージョンの保存データとの互換性のためフィールド自体は残すが、
        // 読み込み時には使用しない(下記applyFullState参照)。
        scalingExponent: 0.5,
      },
      // v4.32でmax-turns入力欄自体を廃止したが、旧バージョンで保存したJSONとの互換目的で
      // フィールド自体は残す(読み込み時には使用しない。下記applyFullState参照)。
      maxTurns: INTERNAL_SAFETY_MAX_TURNS,
      defender: readSideConfig('defender'),
      A: readSideConfig('A'),
      B: readSideConfig('B'),
      enablePatternB: isPatternBEnabled(), // v4.13
    };
  }
  function applySideConfig(prefix, cfg) {
    ORDER.forEach(t => {
      const lvVal = (cfg.lv && (typeof cfg.lv === 'object' ? cfg.lv[t] : cfg.lv)) || 10;
      const fcVal = (cfg.fc && (typeof cfg.fc === 'object' ? cfg.fc[t] : cfg.fc)) != null
        ? (typeof cfg.fc === 'object' ? cfg.fc[t] : cfg.fc) : 5;
      document.getElementById(`${prefix}-lv-${t}`).value = lvVal;
      document.getElementById(`${prefix}-lv-${t}-val`).textContent = Number(lvVal).toFixed(1);
      document.getElementById(`${prefix}-fc-${t}`).value = fcVal;
      document.getElementById(`${prefix}-fc-${t}-val`).textContent = fcVal;
    });
    ORDER.forEach(t => { document.getElementById(`${prefix}-count-${t}`).value = cfg.counts[t]; });
    ORDER.forEach(role => {
      document.getElementById(`${prefix}-hero-${role}`).value = (cfg.heroes[role] && cfg.heroes[role].heroKey) || '';
      const eqLv = (cfg.heroes[role] && cfg.heroes[role].eqLv) || 0;
      document.getElementById(`${prefix}-eq-${role}`).value = eqLv;
      document.getElementById(`${prefix}-eq-${role}-val`).textContent = eqLv;
    });
    if (cfg.wallMitigationPercent != null) document.getElementById(`${prefix}-wall`).value = cfg.wallMitigationPercent;
    if (cfg.shieldReplenishBonus != null) document.getElementById(`${prefix}-replenish`).value = cfg.shieldReplenishBonus * 100;
    applyStatBuff(prefix, cfg.statBuff);
    updateStatTable(prefix);
    ORDER.forEach(role => updateHeroEffect(prefix, role));
  }
  function applyFullState(state) {
    if (state.scenario) document.getElementById('scenario').value = state.scenario;
    if (state.mech) {
      document.getElementById('mech-counter').value = state.mech.counter;
      // v4.16: scalingExponent入力欄は廃止済み(常に平方根モデル固定)のため、旧JSONに値が入っていても
      // 無視する(readMechが常に0.5を使う)。
    }
    // v4.32でmax-turns入力欄自体を廃止したため、旧JSONにこの値が入っていても読み込み時には使用しない
    // (どちらかの兵科が全滅するまで自動的にシミュレーションを続ける仕様に統一)。
    if (state.defender) applySideConfig('defender', state.defender);
    if (state.A) applySideConfig('A', state.A);
    if (state.B) applySideConfig('B', state.B);
    // v4.13: 保存データにenablePatternBが無い場合(v4.12以前のJSON)は、Bパターンの入力値が
    // 実際にあるかどうかで後方互換的に判定する(以前は兵力有無だけで自動判定していたため)。
    const cb = document.getElementById('enable-pattern-b');
    cb.checked = state.enablePatternB != null ? !!state.enablePatternB : (!!state.B && hasAnyTroops(state.B));
    updatePatternBVisibility();
    applyScenario();
  }
  function setupSaveLoad() {
    document.getElementById('btn-export').addEventListener('click', () => {
      const state = collectFullState();
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'wos-fortress-sim-config.json'; a.click();
      URL.revokeObjectURL(url);
    });
    document.getElementById('btn-import').addEventListener('click', () => document.getElementById('file-import').click());
    document.getElementById('file-import').addEventListener('change', (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try { applyFullState(JSON.parse(reader.result)); }
        catch (e) { alert('JSONの読み込みに失敗しました: ' + e.message); }
      };
      reader.readAsText(file);
      ev.target.value = '';
    });
  }

  function init() {
    buildSidePanel(document.getElementById('defender-panel'), 'defender');
    buildSidePanel(document.getElementById('panel-A'), 'A');
    buildSidePanel(document.getElementById('panel-B'), 'B');
    setupTabs();
    setupPatternBToggle();
    setupSaveLoad();
    setupInfoModal();
    document.getElementById('scenario').addEventListener('change', applyScenario);
    applyScenario();
    document.getElementById('btn-run').addEventListener('click', () => runAndRender(false));
    document.getElementById('btn-find-mult').addEventListener('click', () => runAndRender(true));
    document.getElementById('btn-monte-carlo').addEventListener('click', runMonteCarlo);
    setupPdfReport();
    setupTimelineWheelScroll();
  }

  document.addEventListener('DOMContentLoaded', init);
})();

</script>
