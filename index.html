<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遠征戦闘シミュレーター v4.32.0</title>
<!-- v4.27: 「もっと美しい日本語フォントにしてほしい」というご要望を受け、Google Fontsから
     Zen Kaku Gothic New(近未来的でクリーンな印象のゴシック体)をCDN経由で読み込むことにした。
     これにより、これまで維持してきた「単体HTML・外部依存なし(完全オフライン動作)」という設計方針から
     初めて外れる(初回表示時にインターネット接続が必要)。この点はたちばなさんに選択肢を提示のうえ、
     明示的にCDN読み込み案を選んでいただいた結果である。読み込みに失敗した場合は、従来通りOS標準の
     日本語フォント(Hiragino角ゴシック/游ゴシックなど)に自動的にフォールバックする。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* v4.20: 「デザインがダサい」というご指摘を受け、v4.19(ライト基調の紫グラデーション)から
       方向性を大きく変更。たちばなさんの選択(ダークモード・近未来系)に基づき、Whiteout Survivalの
       寒冷サバイバル世界観に合う「氷/シアンの発光アクセント×濃紺〜黒の背景」のダークテーマに全面刷新した。
       単体HTML・外部依存なしの制約は維持し、Webフォント(CDN)・画像は一切使わずCSSのみで実現している。 */
    color-scheme: dark; /* ブラウザ既定のフォームコントロール(select・チェックボックス・スクロールバー等)もダーク基調に寄せる */
    --bg: #070b14; --bg-accent: #0c1526;
    --card: #10192c; --card-alt: #16223a;
    --border: #22304a; --border-soft: #1a2438;
    --input-bg: #0b1220; --input-border: #263756;
    --text: #e7ecf5; --muted: #93a0b8;
    --accent: #22d3ee; --accent-dark: #0891b2; --accent-bright: #7ee8fa; --accent-soft: rgba(34,211,238,.12);
    --accent2: #a78bfa;
    --shield: #38bdf8; --spear: #fbbf24; --archer: #c084fc;
    --ok: #34d399; --danger: #f87171; --warn: #fbbf24;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.5), 0 1px 1px rgba(0,0,0,.35);
    --shadow-md: 0 10px 26px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.35);
    --shadow-lg: 0 24px 60px rgba(0,0,0,.6), 0 6px 18px rgba(0,0,0,.4);
    --glow: 0 0 22px rgba(34,211,238,.25);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  body { margin:0; padding:0 0 60px 0; background-color:var(--bg); color:var(--text);
    background-image:
      radial-gradient(1100px 520px at 8% -8%, rgba(34,211,238,.10), transparent 60%),
      radial-gradient(900px 420px at 100% 6%, rgba(167,139,250,.08), transparent 60%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:auto,auto,48px 48px,48px 48px;
    background-attachment:fixed;
    font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
    font-size:14px; line-height:1.65; letter-spacing:.01em; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:6px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--accent-dark); }
  header { background:linear-gradient(135deg,#03050a 0%,#071022 42%,#0a1d3d 74%,#0e2a52 100%);
    color:#fff; padding:30px 20px; position:relative; overflow:hidden;
    border-bottom:1px solid rgba(34,211,238,.22);
    box-shadow:0 1px 0 rgba(34,211,238,.12), 0 30px 60px rgba(0,0,0,.55); }
  header::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(700px 260px at 85% -35%, rgba(34,211,238,.20), transparent 60%),
      radial-gradient(520px 220px at 6% 130%, rgba(167,139,250,.14), transparent 60%);
  }
  header .wrap { position:relative; }
  header h1 .h1-version { font-size:0.5em; font-weight:600; color:var(--muted); letter-spacing:.01em; margin-left:6px; vertical-align:middle; }
  header h1 { margin:0 0 6px 0; font-size:23px; font-weight:800; letter-spacing:.02em;
    text-shadow:0 0 26px rgba(34,211,238,.35); }
  header p { margin:0; font-size:13px; color:#aeb9d1; }
  .wrap { max-width:1200px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin-bottom:20px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03), var(--shadow-sm); transition:box-shadow .18s ease, border-color .18s ease; }
  .card:hover { box-shadow:inset 0 1px 0 rgba(255,255,255,.04), var(--shadow-md), 0 0 0 1px rgba(34,211,238,.10); border-color:#2a3c5c; }
  .card h2 { font-size:16.5px; margin:0 0 4px 0; font-weight:800; color:var(--text); letter-spacing:.01em;
    display:flex; align-items:center; gap:8px; }
  .card h2::before {
    content:""; display:inline-block; width:4px; height:18px; border-radius:2px; flex-shrink:0;
    background:linear-gradient(180deg,var(--accent),var(--accent2)); box-shadow:0 0 10px rgba(34,211,238,.55);
  }
  .card .sub { color:var(--muted); font-size:12.5px; margin:0 0 14px 0; }
  details.note { background:var(--card-alt); border:1px solid var(--border); border-radius:8px; padding:10px 14px; margin-bottom:18px; font-size:13px; }
  details.note summary { cursor:pointer; font-weight:600; color:var(--warn); }
  details.note ul { margin:8px 0 0 0; padding-left:20px; } details.note li { margin-bottom:6px; }
  table { border-collapse:collapse; width:100%; font-size:13px; color:var(--text); }
  /* v4.19: 見出し行(th)と内容行(td)の配置が一致していなかった(thはブラウザ既定で中央揃え+太字、
     tdは既定で左揃えのため、列幅が揃っていても見た目がズレて見えていた)のが「表が見にくい」
     「見出しと内容がずれる」の直接原因。全テーブル共通でth/tdを中央揃えに統一し、
     スキル名など長いテキストの列だけ個別に(インラインstyleや以下の専用ルールで)左揃えに戻す。 */
  table th, table td { text-align:center; padding:7px 10px; }
  table thead th { font-weight:700; }
  .stat-table th, .stat-table td { border:1px solid var(--border); padding:7px 10px; text-align:center; }
  .stat-table th { background:var(--accent-soft); color:var(--accent-bright); }
  .stat-table tbody tr:nth-child(even) { background:rgba(255,255,255,.025); }
  .type-shield { color:var(--shield); font-weight:700; }
  .type-spear { color:var(--spear); font-weight:700; }
  .type-archer { color:var(--archer); font-weight:700; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  @media (max-width:900px){ .grid2{grid-template-columns:1fr;} .grid3{grid-template-columns:1fr;} }
  fieldset { border:1px solid var(--border); border-radius:8px; margin:0 0 14px 0; padding:10px 14px; }
  legend { font-size:13px; font-weight:700; padding:0 6px; color:var(--accent-bright); }
  .field { margin-bottom:8px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; font-weight:600; }
  .field input, .field select, input[type=text], input[type=number], select {
    width:100%; padding:7px 8px; border:1px solid var(--input-border); border-radius:7px;
    background:var(--input-bg); color:var(--text); font-size:13.5px; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus, .field select:focus, input:focus, select:focus {
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(34,211,238,.2);
  }
  input[type=checkbox] { accent-color:var(--accent); width:16px; height:16px; cursor:pointer; }
  .inline-fields { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .hero-box { border:1px solid var(--border); border-radius:10px; padding:12px; background:var(--card-alt); transition:border-color .15s ease; }
  .hero-box:hover { border-color:rgba(34,211,238,.4); }
  .hero-effect { font-size:11.5px; color:var(--muted); margin-top:6px; }
  .tabs { display:flex; gap:4px; margin-bottom:14px; border-bottom:2px solid var(--border); }
  .tab-btn { padding:9px 20px; border-radius:8px 8px 0 0; border:1px solid transparent; border-bottom:none;
    background:transparent; cursor:pointer; font-weight:700; color:var(--muted); transition:all .15s ease; margin-bottom:-2px; }
  .tab-btn:hover { color:var(--accent-bright); background:var(--accent-soft); }
  .tab-btn.active { background:var(--card); color:var(--accent-bright); border-color:var(--border); border-bottom:2px solid var(--card); }
  .tab-panel { display:none; } .tab-panel.active { display:block; }
  button { cursor:pointer; border:none; border-radius:8px; padding:9px 18px; font-size:13.5px; font-weight:700;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease; }
  .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#04141c;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), var(--shadow-sm), 0 0 18px rgba(34,211,238,.3); }
  .btn-primary:hover { box-shadow:inset 0 1px 0 rgba(255,255,255,.3), var(--shadow-md), 0 0 30px rgba(34,211,238,.5); transform:translateY(-1px); }
  .btn-primary:active { transform:translateY(0); }
  .btn-sub { background:var(--card-alt); color:var(--text); margin-left:8px; border:1px solid var(--border); }
  .btn-sub:hover { background:#1c2a45; border-color:rgba(34,211,238,.4); transform:translateY(-1px); }
  .btn-sub:active { transform:translateY(0); }
  .action-row { margin:18px 0; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .result-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; }
  @media (max-width:900px){ .result-grid{grid-template-columns:minmax(0,1fr);} }
  .result-card { border:1px solid var(--border); border-radius:10px; padding:16px 18px; background:var(--card-alt); min-width:0;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03), var(--shadow-sm); }
  .result-card h3 { margin:0 0 8px 0; font-size:15px; font-weight:800; color:var(--accent-bright); }
  .badge { display:inline-block; padding:3px 12px; border-radius:20px; font-size:12px; font-weight:800; letter-spacing:.02em; border:1px solid transparent; }
  .badge-win { background:rgba(52,211,153,.14); color:var(--ok); border-color:rgba(52,211,153,.35); }
  .badge-lose { background:rgba(248,113,113,.14); color:var(--danger); border-color:rgba(248,113,113,.35); }
  .badge-draw { background:rgba(251,191,36,.14); color:var(--warn); border-color:rgba(251,191,36,.35); }
  .badge-undecided { background:rgba(147,160,184,.14); color:var(--muted); border-color:rgba(147,160,184,.3); }
  .mini-table { font-size:13px; margin-top:8px; max-height:340px; overflow:auto; border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow-sm); }
  .mini-table table { width:auto; min-width:100%; border-collapse:collapse; }
  .mini-table th, .mini-table td { white-space:nowrap; padding:6px 12px; border-bottom:1px solid var(--border-soft); text-align:center; }
  .mini-table thead th { position:sticky; top:0; background:#132038; color:var(--accent-bright); z-index:1; box-shadow:0 1px 0 var(--border); }
  .mini-table tbody tr:nth-child(even) { background:rgba(255,255,255,.02); }
  .mini-table tbody tr:hover { background:var(--accent-soft); }
  .mini-table td:last-child, .mini-table th:last-child { white-space:normal; min-width:120px; }
  /* v4.12: スキル発動タイムライン表(1行=1スキル、1列=1ターン)専用のスタイル。
     ターン列は数字/マークのみで狭くてよいのでpaddingを詰め、スキル名列(1列目)は
     横スクロールしても見出しが分かるようsticky(左端固定)にする。 */
  .timeline-table th, .timeline-table td { padding:4px 6px; font-size:12px; }
  .timeline-table td:last-child, .timeline-table th:last-child { white-space:nowrap; min-width:0; }
  .timeline-table th:first-child, .timeline-table td:first-child {
    position:sticky; left:0; background:var(--card-alt); z-index:2; box-shadow:1px 0 0 var(--border); text-align:left;
  }
  .timeline-table thead th:first-child { z-index:3; background:#132038; }
  .req-mult-box { margin-top:10px; padding:10px 12px; background:var(--accent-soft); border-radius:8px; font-size:13px; border:1px solid rgba(34,211,238,.3); }
  .hero-log { font-size:11px; color:var(--muted); margin-top:6px; }
  .role-badge { display:inline-block; padding:3px 12px; border-radius:20px; font-size:12px; font-weight:800; background:rgba(255,255,255,.06); color:var(--text); margin-left:8px; letter-spacing:.02em; border:1px solid var(--border); }
  .slider-row { display:flex; align-items:center; gap:8px; }
  .slider-row input[type=range] { flex:1; }
  .slider-row .slider-val { min-width:20px; text-align:center; font-weight:700; color:var(--accent-bright); }
  input[type=range] { -webkit-appearance:none; appearance:none; height:5px; border-radius:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); background-size:100% 100%; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:16px; height:16px;
    border-radius:50%; background:#e7ecf5; border:2.5px solid var(--accent); box-shadow:0 0 10px rgba(34,211,238,.6); cursor:pointer; }
  input[type=range]::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:#e7ecf5;
    border:2.5px solid var(--accent); box-shadow:0 0 10px rgba(34,211,238,.6); cursor:pointer; }
  /* v4.17: 常時表示していた説明文・注記を、クリックで開くinfoアイコン+モーダルに置き換えるためのスタイル。
     見出しの隣に小さな「ⓘ」を置き、押すと画面中央にモーダルで説明を表示する(通常は非表示なので
     画面が文章で埋まらない)。 */
  .info-icon {
    display:inline-flex; align-items:center; justify-content:center;
    width:19px; height:19px; min-width:19px; flex-shrink:0; padding:0; line-height:1;
    border-radius:50%; background:var(--accent-soft); color:var(--accent-bright);
    font-size:12px; font-weight:800; font-style:normal; cursor:pointer; margin-left:6px;
    vertical-align:middle; user-select:none; border:none; transition:all .15s ease; box-sizing:border-box;
  }
  .info-icon:hover { background:var(--accent); color:#04141c; box-shadow:0 0 14px rgba(34,211,238,.6); }
  .modal-overlay {
    display:none; position:fixed; inset:0; background:rgba(2,6,16,.72); z-index:1000;
    align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(3px);
  }
  .modal-overlay.open { display:flex; }
  .modal-box {
    background:var(--card); border:1px solid var(--border); border-radius:14px; max-width:720px; width:100%; max-height:80vh;
    overflow:auto; padding:22px 26px; box-shadow:var(--shadow-lg), 0 0 0 1px rgba(34,211,238,.12); position:relative;
  }
  .modal-box h3 { margin:0 0 12px 0; font-size:16.5px; font-weight:800; color:var(--accent-bright); padding-right:28px; }
  .modal-box ul { margin:0; padding-left:20px; font-size:13px; line-height:1.7; color:var(--text); }
  .modal-box ul li { margin-bottom:8px; }
  .modal-box p { font-size:13px; line-height:1.7; color:var(--text); margin:0 0 10px 0; }
  .modal-close {
    position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px;
    line-height:1; color:var(--muted); cursor:pointer; padding:2px 6px; border-radius:6px; transition:all .15s ease;
  }
  .modal-close:hover { color:var(--text); background:rgba(255,255,255,.08); }

  /* v4.28: PDFレポート出力(印刷専用セクションパターン)。
     通常時は#pdf-reportを非表示にしておき、印刷時(=ブラウザの印刷ダイアログで「PDFに保存」を
     選んだ時)だけ、画面の他の要素をすべて隠して#pdf-reportだけを表示する。ダークテーマの
     CSS変数には依存せず、印刷を前提に白背景・黒文字の配色をこのコンテナ内だけに明示指定する
     (配色はdata-vizガイドラインで検証済みの値: 盾兵=blue #2a78d6 / 槍兵=orange #eb6834 /
     弓兵=aqua #1baf7a、勝敗は good #0ca30c / critical #d03b3b)。 */
  #pdf-report { display:none; }
  @media print {
    /* v4.28: 当初visibility:hiddenで隠す実装にしていたが、非表示にした要素も文書のレイアウト上の
       高さを占有し続けるため、PDF化した際に末尾へ大量の空白ページが付いてしまう不具合があった。
       body直下の要素をdisplay:noneで完全に文書の流れから外す方式に変更し、この問題を解消した
       (#pdf-report以外のbody直下の要素[header・div.wrap]を対象に非表示化する)。 */
    body > *:not(#pdf-report) { display:none !important; }
    #pdf-report { display:block !important; }
    @page { margin:14mm; }
  }
  #pdf-report {
    background:#ffffff; color:#0b0b0b;
    font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
    padding:16px; font-size:13px; line-height:1.6;
  }
  #pdf-report h1 { font-size:20px; margin:0 0 4px 0; }
  #pdf-report h2 { font-size:16px; margin:24px 0 8px 0; border-bottom:2px solid #2a78d6; padding-bottom:4px; }
  #pdf-report h3 { font-size:13.5px; margin:14px 0 6px 0; }
  /* v4.28修正: 共通CSSの`table { color:var(--text); }`(ダークテーマ用のほぼ白に近い色)が、
     このレポート内のtableにも適用されてしまい、白背景に対して非常に薄い文字色になっていた不具合を
     修正(印刷確認時に発覚)。#pdf-report内のtable/th/tdには明示的に濃色を指定し、共通ルールを
     確実に上書きする。 */
  #pdf-report table { border-collapse:collapse; width:100%; margin:6px 0 10px 0; font-size:12px; color:#0b0b0b; }
  #pdf-report th, #pdf-report td { border:1px solid #d8d8d4; padding:4px 8px; text-align:right; color:#0b0b0b; }
  #pdf-report th:first-child, #pdf-report td:first-child { text-align:left; }
  #pdf-report th.type-shield, #pdf-report td.type-shield { color:#2a78d6; }
  #pdf-report th.type-spear, #pdf-report td.type-spear { color:#eb6834; }
  #pdf-report th.type-archer, #pdf-report td.type-archer { color:#1baf7a; }
  #pdf-report .chart-img { max-width:100%; display:block; margin:6px 0 4px 0; page-break-inside:avoid; }
  #pdf-report .legend { font-size:11.5px; color:#52514e; margin:2px 0 8px 0; }
  #pdf-report .legend span { margin-right:16px; white-space:nowrap; }
  #pdf-report .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:middle; }
  #pdf-report .meta { font-size:12px; color:#52514e; margin:0 0 16px 0; }
  #pdf-report .footnote { font-size:11px; color:#75746c; margin-top:22px; border-top:1px solid #d8d8d4; padding-top:8px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>遠征戦闘シミュレーター<span class="h1-version">v4.32.0</span><button type="button" class="info-icon" data-info="premise" title="前提条件">i</button></h1>
    <p>集結(攻撃)と駐屯(防衛)の戦闘を、陣形・ダメージ式・英雄構成をもとに試算します。</p>
  </div>
</header>

<div class="wrap">

  <!-- v4.17: 常時表示していた説明文・注記は、見出し隣のinfoアイコン(i)をクリックした時だけ
       モーダルで表示する形に変更した。アイコンの中身(タイトル・本文)はapp.js側のINFO_CONTENTS
       に定義している。 -->
  <div id="info-modal-overlay" class="modal-overlay">
    <div class="modal-box">
      <button type="button" class="modal-close" id="info-modal-close">&times;</button>
      <h3 id="info-modal-title"></h3>
      <div id="info-modal-body"></div>
    </div>
  </div>

  <div class="card">
    <h2>① 対戦シナリオ・全体設定<button type="button" class="info-icon" data-info="scaling-exponent" title="兵力数の寄与について">i</button></h2>
    <div class="field" style="max-width:520px;margin-bottom:14px;">
      <label>対戦シナリオ</label>

const ORDER = ['shield', 'spear', 'archer']; // 盾兵(歩兵) / 槍兵 / 弓兵

const COUNTER = { shield: 'spear', spear: 'archer', archer: 'shield' };

// T7以上の兵科スキル(既定値。ツール上で有効/無効・数値を調整可能)
const DEFAULT_MECH = {
  counterBonus: 0.10,   // 相性ボーナス(盾→槍→弓→盾)
  bandsOfSteel: 0.10,   // 盾兵T7「鋼の帯」: 槍兵に対する被ダメ軽減相当(防御力+10%として反映)
  volleyMult: 0.10,     // 弓兵T7「連射」: 10%の確率で2回攻撃→期待値として与ダメ+10%
  ambushRate: 0.20,     // 槍兵T7「奇襲」: 攻撃の20%が後列の弓兵を直接攻撃
  // 兵力数のダメージ寄与指数。1.0=兵力数に比例、1.0未満(例: 0.5=平方根)にすると、同じ総兵力でも
  // 兵科が偏っているほうが総ダメージが伸びにくくなる(=兵科を分散させた方が有利になる)。
  // 「集結・駐屯おすすめ英雄一覧」解説資料の「ダメージは兵力数に比例するが、少ない兵科を増やす方が

// 兵力数を「ダメージ算出用の実効兵力数」に変換する。
// countScalingExponent(p)=1なら常にcount本人(=従来通りの挙動)。
// p<1の場合、同じ兵科合計(shield+spear+archer)を保ったまま、多い兵科は相対的に割り引かれ、
// 少ない兵科は相対的に割り増しされる(=偏った編成ほど総ダメージが伸びにくくなる)。
// 基準点(全兵科が均等=total/3のとき)では p の値によらず effectiveCount=count のまま変化しない。
function effectiveCountForDamage(countsThisTurn, type, exponent) {
  const count = Math.max(0, countsThisTurn[type] || 0);
  if (count <= 0) return 0;
  if (exponent == null || Math.abs(exponent - 1) < 1e-9) return count;
  const total = ORDER.reduce((s, t) => s + Math.max(0, countsThisTurn[t] || 0), 0);
  const ref = total / 3;
  if (ref <= 0) return count;
  return Math.pow(ref, 1 - exponent) * Math.pow(count, exponent);
}

// ---- 兵種基礎ステータス(T10/T11 × 火晶Lv0-10) ----
// 出典: wostools.net/wiki/troops/ 掲載の公式Fire Crystal Troop Stats。
// 各行 = 火晶Lv0〜10、値は [防御, 攻撃, HP, 殺傷力]。
const FC_STATS = {

    11: [[15,12,17,12],[16,13,18,12],[17,14,19,13],[18,15,20,14],[19,15,21,15],[22,16,22,15],[23,17,23,16],[24,17,24,16],[25,18,25,17],[27,18,26,17],[28,19,27,18]],
  },
  spear: {
    10: [[11,13,11,14],[12,14,11,15],[13,16,12,16],[14,17,13,17],[14,18,13,18],[15,20,14,19],[15,21,14,20],[16,22,15,21],[17,23,15,22],[17,25,16,23],[19,26,17,24]],
    11: [[13,15,13,16],[14,16,13,17],[15,18,14,18],[16,19,15,19],[16,20,15,20],[17,22,16,21],[18,23,16,22],[18,24,17,23],[19,25,17,24],[19,27,18,25],[21,28,20,26]],
  },
  archer: {
    10: [[10,14,10,15],[11,15,11,16],[12,17,12,17],[13,18,13,18],[14,19,13,19],[14,21,14,20],[15,22,14,21],[15,23,15,22],[16,24,15,23],[17,26,16,24],[19,27,17,25]],
    11: [[12,16,12,17],[13,17,13,18],[14,19,14,19],[15,20,15,20],[16,21,15,21],[16,23,16,22],[17,24,16,23],[18,25,17,24],[19,26,18,25],[19,28,18,26],[21,30,20,27]],

function troopStats(type, lv, fc) {
  const f = Math.max(0, Math.min(10, Math.round(fc)));
  const a = FC_STATS[type][10][f], b = FC_STATS[type][11][f];
  const t = Math.max(0, Math.min(1, lv - 10));
  return {
    def: a[0] + (b[0] - a[0]) * t,
    atk: a[1] + (b[1] - a[1]) * t,
    hp: a[2] + (b[2] - a[2]) * t,
    leth: a[3] + (b[3] - a[3]) * t,
  };
}

// ---- 火晶スキル(兵科固有、火晶Lvに応じて発動) ----
function fcSkillRaw(type, fc) {
  const out = { dealt: 1, taken: 1, defBonus: 0, note: [] };
  const f = Math.round(fc);
  if (f < 3) return out;
  if (type === 'spear') {
    const p = f >= 5 ? 0.15 : 0.10;
    out.dealt *= (1 + p);
    out.note.push(`結晶槍: ${(p * 100).toFixed(0)}%で2倍ダメージ(期待値) → 与ダメ×${(1 + p).toFixed(3)}`);
    if (f >= 8) {
      const q = f >= 10 ? 0.15 : 0.10;
      out.taken *= (1 - q * 0.5);
      out.note.push(`白熱フィールド: ${(q * 100).toFixed(0)}%で被ダメ半減(期待値) → 被ダメ×${(1 - q * 0.5).toFixed(3)}`);
    }
  } else if (type === 'archer') {
    const p = f >= 5 ? 0.30 : 0.20;
    out.dealt *= (1 + p * 0.5);
    out.note.push(`結晶火薬: ${(p * 100).toFixed(0)}%で+50%ダメージ(期待値) → 与ダメ×${(1 + p * 0.5).toFixed(3)}`);
    if (f >= 8) {
      const au = f >= 10 ? 0.06 : 0.04, ex = f >= 10 ? 0.375 : 0.25;
      out.dealt *= (1 + au) * (1 + p * ex);
      out.note.push(`焔の装填: 基本攻撃+${(au * 100).toFixed(0)}%、発動時追加+${(ex * 100).toFixed(1)}% → 与ダメ×${((1 + au) * (1 + p * ex)).toFixed(3)}`);
    }
  } else {
    const p = f >= 5 ? 0.15 : 0.10;
    out.taken *= (1 - p);
    out.note.push(`結晶シールド: ダメージ打ち消し(期待値、他兵種との釣り合いから推定) → 被ダメ×${(1 - p).toFixed(3)}`);
    if (f >= 8) {
      const db = f >= 10 ? 0.06 : 0.04, ex = f >= 10 ? 0.15 : 0.10;
      out.defBonus = db;
      out.taken *= (1 - ex);
      out.note.push(`光の体: 防御+${(db * 100).toFixed(0)}%、発動時追加軽減 → 被ダメ×${(1 - ex).toFixed(3)}`);

}
const _fcCache = {};
function fcSkill(type, fc) {
  const key = type + '|' + Math.round(fc);
  if (_fcCache[key]) return _fcCache[key];
  return (_fcCache[key] = fcSkillRaw(type, fc));
}

// ---- 英雄バフの合成 ----
// 同じ(scope,stat)の組み合わせに対する複数の効果量(%)は「加算」してから(1+合計%)を掛ける。
// 異なるstat(dealt/taken/hp)同士や、異なる由来(英雄バフ/専用装備/火晶スキル/兵の質)は「乗算」で合成する。
// (「集結・駐屯おすすめ英雄一覧」解説資料の「同じ種類は積算、違う種類は乗算」という説明に準拠)
function freshModAccum() {
  return {
    all: { dealt: 0, taken: 0, hp: 0 },
    shield: { dealt: 0, taken: 0, hp: 0 },
    spear: { dealt: 0, taken: 0, hp: 0 },
    archer: { dealt: 0, taken: 0, hp: 0 },
  };
}
function addPct(accum, scope, stat, pct) {
  if (!accum[scope]) return;
  accum[scope][stat] += pct;
}
// 【v4.29で追加】被ダメ方向の倍率は「1 - 防御力%/100」という単純な線形の式で計算しているため、
// 兵科ごとの防御力%(ゲーム内「追加ステータス」画面の値、領主装備・ペット・専門家・戦争研究等の
// 合計)が100%を超えると、この式の結果が0以下(=マイナス)になってしまう。ダメージ量に負の倍率を
// 掛けると「マイナスのダメージ」=「毎ターン兵力が回復し続ける」という現実にありえない状態になり、
// 兵力が上限なく増え続けて最終的にJavaScript側の数値としてInfinity(無限大)に達し、結果表示が
// すべて「∞」になってしまう不具合があった(2026/08/16、たちばなさんの実際の高レベルアカウントの
// データ[防御力%が1000%を超える]で発覚。デフォルトの少人数・低レベルの動作確認だけでは
// 100%を超えるケースに気づけなかった)。
// 【裏取りについての注記】ゲーム本体に実際の被ダメ軽減率の上限(キャップ)が存在するかどうかは
// 未確認だが、少なくとも「軽減率が100%を超えて兵力が回復し続ける」という挙動はどう考えても
// 現実のゲーム仕様とは考えにくいため、本ツール側の安全策として、被ダメ倍率(taken)・HP倍率(hp)を
// 0近く(TAKEN_HP_MULT_FLOOR=0.05、つまり最大95%軽減相当)で下限クリップし、与ダメ倍率(dealt)は
// 0未満にならないようクリップする。この下限値(0.05)自体は公式資料に基づく検証済みの数値ではなく、
// 「計算が破綻しない」ことを優先したツール側の暫定的な安全策である点にご留意ください。
const TAKEN_HP_MULT_FLOOR = 0.05;
function toMultiplier(accum) {
  const m = {};
  for (const scope of ['all', 'shield', 'spear', 'archer']) {
    m[scope] = {
      dealt: Math.max(0, 1 + accum[scope].dealt / 100),
      taken: Math.max(TAKEN_HP_MULT_FLOOR, 1 + accum[scope].taken / 100),
      hp: Math.max(TAKEN_HP_MULT_FLOOR, 1 + accum[scope].hp / 100),

  }
  return m;
}

// heroSelection = { shield: {heroKey, eqLv}, spear: {...}, archer: {...} }
// mode = 'attack'(集結) | 'defense'(駐屯)
// statBuff = { shield:{atk,def,leth,hp}, spear:{...}, archer:{...} } (%, 実際のゲーム内「追加ステータス」
//             画面(領主装備・ペット・専門家・戦争研究・英雄バフ等すべて込みの合計%)をそのまま入力したもの)
function buildMods(heroSelection, heroesDb, mode, statBuff, enemyAccumOut) {
  const accum = freshModAccum();
  const log = [];
  const periodic = []; // 確定的な周期(乱数ではない)で発動するスキル。{scope,stat,pct,cycleTurns,activeTurns,heroName,role,skillName,kind}
  const proc = []; // 確率発動スキル(v4.11で追加)。{scope,stat,chance,magnitude,heroName,role,skillName}
  // constant: 「常時発動しているスキル」欄に表示するための、常時(または装備レベル・戦闘モードなど戦闘開始時点で
  // 確定する条件)で発動しているスキル源の一覧。{role,heroName,kind,skillName} 1エントリ=1スキル
  // (同じ英雄が複数の異なるスキルを持つ場合は、スキルごとに別エントリとして積む)。
  // kind: '遠征スキル' | '専用装備スキル' | '敵デバフ' (どの種類のスキルが発動しているかをUIで区別するため)
  // ※ 確率発動スキル(procBuffs)はここには含めない。数値としては期待値換算で常時accumに加算済みだが、
  //   表示上は「ターン毎の内訳」側でその確率に従った乱数例を都度表示するため(v4.11)。
  const constant = [];
  ORDER.forEach(role => {
    const sel = heroSelection[role];
    if (!sel || !sel.heroKey || !heroesDb[sel.heroKey]) return;
    const hero = heroesDb[sel.heroKey];
    const seenTalentSkillNames = new Set();
    (hero.buffs || []).forEach(b => {
      addPct(accum, b.scope, b.stat, b.pct * 100);
      log.push({ role, heroName: hero.name, kind: '遠征スキル', scope: b.scope, stat: b.stat, pct: b.pct * 100, skillName: b.skillName, skillNameJa: b.skillNameJa });
      // skillNameが分かっている場合は同じスキル名につき1エントリにまとめ、不明な場合は英雄1体につき1エントリにする。
      const dedupeKey = b.skillName || '__unnamed_talent__';
      if (!seenTalentSkillNames.has(dedupeKey)) {
        seenTalentSkillNames.add(dedupeKey);
        constant.push({ role, heroName: hero.name, kind: '遠征スキル', skillName: b.skillName, skillNameJa: b.skillNameJa });
      }
    });
    (hero.periodicBuffs || []).forEach(pb => {
      periodic.push({
        role, heroName: hero.name,
        scope: pb.scope, stat: pb.stat, pct: pb.pct * 100,
        cycleTurns: pb.cycleTurns, activeTurns: pb.activeTurns, skillName: pb.skillName, skillNameJa: pb.skillNameJa,
      });
      log.push({
        role, heroName: hero.name,
        kind: `周期発動スキル(${pb.cycleTurns}ターン周期中${pb.activeTurns}ターン有効、有効時)`,
        scope: pb.scope, stat: pb.stat, pct: pb.pct * 100, skillName: pb.skillName, skillNameJa: pb.skillNameJa,
      });
    });
    // 確率発動スキル(procBuffs): {scope,stat,chance(0-1),magnitude(発動時の効果量、小数),skillName}
    // 例: ノラ「Sneak Strike」= 槍兵の攻撃時20%の確率で敵全体に(Lvに応じ最大)100%の追加ダメージ。
    // 【v4.14で変更】v4.11〜v4.13では、勝敗・損耗数などの計算には期待値(chance×magnitude)を
    // 常時の一定倍率としてaccumへ加算し、「ターン毎の内訳」表示だけは別途isProcActive()の乱数判定で
    // 発動/非発動を表示する、という2階建ての実装だった。これだと表示上「発動していないターン」でも
    // 実際の損耗数の計算には常にこの期待値が乗ったままになり、「表示と計算が一致していない
    // (発動有無が結果の数値に何も影響しない)」という矛盾があった。v4.14では、ここではaccumに
    // 加算せず、実際の効果はmodsForTurn()側で「そのターン実際に発動と判定された場合のみ」
    // 満額(magnitude)を加算する形に統一した(periodicBuffsと同じ扱いに揃えた)。これにより、
    // 発動したターンだけ実際に損耗数が変化し、表示と計算が一致するようになる。
    // なお、同じ設定・同じ乱数シード(trialSeed)であれば発動パターンは再現されるため、通常の
    // 単発シミュレーションは引き続き決定的(再現可能)である。実際の乱数を使った試行ごとのばらつきを
    // 見たい場合は、runBattleMonteCarlo()(v4.14で追加)を使う。
    (hero.procBuffs || []).forEach(pb => {
      proc.push({ role, heroName: hero.name, scope: pb.scope, stat: pb.stat, chance: pb.chance, magnitude: pb.magnitude, skillName: pb.skillName, skillNameJa: pb.skillNameJa });
      log.push({
        role, heroName: hero.name,
        kind: `確率発動スキル(${Math.round(pb.chance * 100)}%の確率で発動、発動したターンのみ効果量${(pb.magnitude * 100).toFixed(1)}%を適用。期待値は参考値)`,
        scope: pb.scope, stat: pb.stat, pct: pb.chance * pb.magnitude * 100, skillName: pb.skillName, skillNameJa: pb.skillNameJa,
      });
    });
    if (hero.enemyDebuff && enemyAccumOut) {
      addPct(enemyAccumOut, 'all', hero.enemyDebuff.stat, hero.enemyDebuff.pct * 100);
      log.push({ role, heroName: hero.name, kind: '敵デバフ', scope: 'all', stat: hero.enemyDebuff.stat, pct: hero.enemyDebuff.pct * 100, skillName: hero.enemyDebuff.skillName, skillNameJa: hero.enemyDebuff.skillNameJa });
      constant.push({ role, heroName: hero.name, kind: '敵デバフ', skillName: hero.enemyDebuff.skillName, skillNameJa: hero.enemyDebuff.skillNameJa });
    }
    if (hero.equip && hero.equip.skill) {
      const eqLv = Math.max(0, Math.min(5, sel.eqLv || 0));
      const f = eqLv / 5;
      const s = hero.equip.skill;
      if (s.mode === mode && f > 0) {
        const magnitude = 15 * f; // 専用装備スキルは満レベルで+15%相当
        // 'taken'(被ダメ)方向は「軽減」が本来の効果なので符号を反転する。
        // 以前はここが常に+側で加算されており、防衛系(stat:'taken')の遠征スキルを持つ英雄
        // (ローガン、アクモス等7体)が、実際には被ダメが増える(逆効果になる)バグがあった。
        const signedPct = s.stat === 'taken' ? -magnitude : magnitude;
        addPct(accum, s.scope, s.stat, signedPct);
        log.push({ role, heroName: hero.name, kind: `専用装備スキル(Lv.${eqLv})`, scope: s.scope, stat: s.stat, pct: signedPct, skillName: s.skillName, skillNameJa: s.skillNameJa });
        // 遠征スキルはeqLv>0かつ現在の戦闘モード(集結/駐屯)と一致する場合のみ発動する条件付きスキルなので、
        // 「発動したスキル」欄でも遠征スキルとは明確に区別して表示する(ユーザーからの「どの遠征スキルが
        // 発動しているか分からない」という指摘への対応)。
        constant.push({ role, heroName: hero.name, kind: '専用装備スキル', skillName: s.skillName, skillNameJa: s.skillNameJa });
      }
    }
    // 専用装備そのものの殺傷力/HP上昇(statPct)。以前は表示のみで計算に反映していなかったが、
    // 専用装備レベル(0〜5)に比例する形で実際の計算に組み込む。これは「スキル」ではなく装備の素の
    // ステータス上昇のため、「発動したスキル」欄(constant)には含めない(適用された英雄バフの内訳には表示)。
    if (hero.equip && hero.equip.statPct) {
      const eqLv = Math.max(0, Math.min(5, sel.eqLv || 0));
      const f = eqLv / 5;
      if (f > 0) {
        const pct = hero.equip.statPct * f * 100;
        addPct(accum, role, 'dealt', pct); // 殺傷力上昇分(近似として与ダメ側に加算)
        addPct(accum, role, 'hp', pct);    // HP上昇分
        log.push({ role, heroName: hero.name, kind: `専用装備ステータス(Lv.${eqLv})`, scope: role, stat: 'dealt/hp', pct });
      }
    }
  });
  // 実際の「追加ステータス」画面の数値(領主装備・ペット・専門家・戦争研究・英雄バフ等すべて込みの
  // 合計%)を兵科ごとに直接反映する。攻撃力・殺傷力は与ダメ(dealt)側、防御力は被ダメ(taken)側
  // (符号反転、防御up=被ダメ減のため)、HPはそのままhp側に加算する。
  ORDER.forEach(t => {
    const sb = (statBuff && statBuff[t]) || {};
    addPct(accum, t, 'dealt', (sb.atk || 0) + (sb.leth || 0));
    addPct(accum, t, 'taken', -(sb.def || 0));
    addPct(accum, t, 'hp', sb.hp || 0);
  });

  return { accum, periodic, proc, constant, log };
}

// 周期発動スキルが、指定ターン(1始まり)で有効かどうか。
// cycleTurnsターンを1周期とし、周期の先頭からactiveTurns分だけ有効(位相の仮定はheroes-data.jsの
// コメントを参照。real-game上の正確な位相までは裏取りできていない)。
function isPeriodicActive(pb, turn) {
  if (!pb.cycleTurns) return false;
  const phase = (turn - 1) % pb.cycleTurns;
  return phase < pb.activeTurns;
}

// ---- 確率発動スキルの「ターン毎の内訳」表示用、疑似乱数(シード固定・再現可能) ----
// 同じ入力(英雄・スキル・ターン数)なら常に同じ結果を返す決定的な関数にすることで、
// 「必要兵力倍率」の二分探索や、同じ編成を再計算したときに毎回違う結果になる(=再現性が
// なくなる)ことを避けている。実際の戦闘計算(勝敗・損耗数)にはこの乱数を一切使わない
// (期待値換算のみで計算する。上記buildMods参照)。あくまで「ターン毎の内訳」表示欄に、
// 実際のゲームでは発動したりしなかったりすることを視覚的に示すための一例。
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function seededRoll01(key) {
  let seed = hashStr(key) | 0;
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
// trialSeed: 通常の単発シミュレーションでは既定値(0)で固定し、同じ編成なら常に同じ発動パターンに
// なる(再現可能・必要兵力倍率の二分探索も安定する)。runBattleMonteCarlo()(v4.14で追加)が
// 試行ごとに異なるtrialSeedを渡すことで、実際の乱数を使った試行間のばらつきを再現する。
function isProcActive(pb, turn, sideTag, trialSeed) {
  if (!pb.chance) return false;
  const key = `${trialSeed != null ? trialSeed : 0}|${sideTag || ''}|${pb.heroName || ''}|${pb.skillName || ''}|${pb.scope}|${pb.stat}|${turn}`;
  return seededRoll01(key) < pb.chance;
}

// baseAccum(常時分の%集計)に、指定ターンで有効な周期・確率発動スキルの%を上乗せしたものをmultiplierへ変換する。
// 戻り値のactiveListは、そのターンに「ターン毎の内訳」表示上、変動要素として列挙すべきスキルの一覧
// (常時発動しているスキルは別途「常時発動しているスキル」欄に1回だけ表示するため、ここには含めない。v4.11)。
// activeListの各要素は {heroName, role, kind, skillName} 形式。
// - kind:'periodic' のスキルは、実際にそのターンが周期の有効期間に該当する場合のみ列挙され、%もこの時点で加算する
//   (確定的な周期。乱数ではない)。
// - kind:'proc' のスキルは、確率発動スキルの実際のchance(%)に従った疑似乱数判定(isProcActive)の結果、
//   そのターンに「発動した」と判定された場合のみ列挙され、【v4.14で変更】このときのみ実際にmagnitude(満額)を
//   accumへ加算する(以前は表示のみで、期待値がbuildMods側で常時加算されていたため、表示と計算が
//   一致しない矛盾があった。この矛盾を解消するための変更)。
function modsForTurn(side, turn, sideTag, trialSeed) {
  const accum = freshModAccum();
  ORDER.concat('all').forEach(scope => {
    ['dealt', 'taken', 'hp'].forEach(stat => { accum[scope][stat] = side.accum[scope][stat]; });
  });
  const activeList = [];
  const seenPeriodicSkills = new Set();
  (side.periodic || []).forEach(pb => {
    if (isPeriodicActive(pb, turn)) {
      addPct(accum, pb.scope, pb.stat, pb.pct);
      // 同一スキル(例:ノラ「Momentum」)がdealt/takenの2つのbuff行に分かれている場合、
      // 表示上は1エントリにまとめる。
      const dedupeKey = pb.heroName + '|' + (pb.skillName || '__unnamed_periodic__');
      if (!seenPeriodicSkills.has(dedupeKey)) {
        seenPeriodicSkills.add(dedupeKey);
        activeList.push({ heroName: pb.heroName, role: pb.role, kind: 'periodic', skillName: pb.skillName, skillNameJa: pb.skillNameJa, cycleTurns: pb.cycleTurns, activeTurns: pb.activeTurns });
      }
    }
  });
  const seenProcSkills = new Set();
  (side.proc || []).forEach(pb => {
    if (isProcActive(pb, turn, sideTag, trialSeed)) {
      // 【v4.14】発動したと判定されたターンのみ、期待値ではなく実際の効果量(magnitude、満額)を加算する。
      addPct(accum, pb.scope, pb.stat, pb.magnitude * 100);
      const dedupeKey = pb.heroName + '|' + (pb.skillName || '__unnamed_proc__');
      if (!seenProcSkills.has(dedupeKey)) {
        seenProcSkills.add(dedupeKey);
        activeList.push({ heroName: pb.heroName, role: pb.role, kind: 'proc', skillName: pb.skillName, skillNameJa: pb.skillNameJa, chance: pb.chance });
      }
    }
  });
  return { mods: toMultiplier(accum), activeList };
}

// ---- 1回の攻撃(攻撃側1兵科 → 防御側1兵科)のダメージ ----
// dmg = 攻撃力 × 殺傷力/(殺傷力+防御力) を基本とし、各種倍率を乗算する。
function unitDamage(attackerType, aStat, defenderType, dStat, aFC, dFC, aMods, dMods, mech, scale) {
  let def = dStat.def;
  if (defenderType === 'shield' && attackerType === 'spear') def *= (1 + mech.bandsOfSteel);
  if (defenderType === 'shield') def *= (1 + fcSkill('shield', dFC).defBonus);

  let dmg = aStat.atk * (aStat.leth / (aStat.leth + def));
  if (COUNTER[attackerType] === defenderType) dmg *= (1 + mech.counterBonus);
  if (attackerType === 'archer') dmg *= (1 + mech.volleyMult);

  dmg *= fcSkill(attackerType, aFC).dealt;
  dmg *= fcSkill(defenderType, dFC).taken;

  dmg *= aMods.all.dealt * aMods[attackerType].dealt;
  dmg *= dMods.all.taken * dMods[defenderType].taken;

  return dmg * (scale === undefined ? 1 : scale);
}

function effectiveHpPerUnit(type, stat, mods, replenishBonus) {
  return stat.hp * mods.all.hp * mods[type].hp * (1 + (type === 'shield' ? (replenishBonus || 0) : 0));
}

// baseline = { lv:{shield,spear,archer}, fc } (兵科ごとのTier/火晶レベル。通常は共通値でOK)
function calibrateScale(attackerBaseline, defenderBaseline, targetTurns, mech) {
  const neutralMods = toMultiplier(freshModAccum());
  let total = 0, n = 0;
  for (const at of ORDER) {
    for (const tt of ORDER) {
      const aStat = troopStats(at, attackerBaseline.lv[at], attackerBaseline.fc);
      const dStat = troopStats(tt, defenderBaseline.lv[tt], defenderBaseline.fc);
      total += unitDamage(at, aStat, tt, dStat, attackerBaseline.fc, defenderBaseline.fc, neutralMods, neutralMods, mech, 1);
      n++;
    }
  }
  const avgDamage = total / n;
  const avgHp = ORDER.reduce((s, t) => s + troopStats(t, defenderBaseline.lv[t], defenderBaseline.fc).hp, 0) / 3;
  return avgDamage > 0 ? avgHp / (avgDamage * Math.max(1, targetTurns)) : 1;
}

/**
 * side config = {
 *   lv: {shield,spear,archer}, fc: {shield,spear,archer} (v4.7〜兵科ごとに個別。後方互換のため
 *       単一のnumberが渡された場合は3兵科とも同じ値として扱う),
 *   counts: {shield,spear,archer},
 *   heroes: { shield:{heroKey,eqLv}, spear:{...}, archer:{...} },
 *   mode: 'attack' | 'defense',
 *   statBuff: { shield:{atk,def,leth,hp}, spear:{...}, archer:{...} }
 *             (実際のゲーム内「追加ステータス」画面の合計%を兵科ごとにそのまま入力したもの、任意),
 *   wallMitigationPercent (defenderのみ想定, 任意)
 *   shieldReplenishBonus (defenderのみ想定, 駐屯の盾兵優先補充を簡易再現。既定0.20)
 * }
 */
function prepareSide(config, heroesDb, enemyAccumOut) {
  const stats = {};
  // fcは兵科ごとに個別の値を受け取る({shield,spear,archer})。後方互換のため、単一の数値が
  // 渡された場合は3兵科とも同じ値として扱う。
  const fcByType = (config.fc && typeof config.fc === 'object')
    ? config.fc
    : { shield: config.fc, spear: config.fc, archer: config.fc };
  ORDER.forEach(t => { stats[t] = troopStats(t, config.lv[t], fcByType[t]); });
  const { accum, periodic, proc, constant, log } = buildMods(config.heroes, heroesDb, config.mode, config.statBuff || {}, enemyAccumOut);
  // HPプール(兵力の耐久量)は周期・確率発動スキルの影響を受けない前提(現状、periodicBuffs/procBuffsで
  // hpを対象にした英雄は存在しない)なので、常時分(accum)のみのmultiplierで計算する。
  const baseMods = toMultiplier(accum);
  const hp = {};
  ORDER.forEach(t => {
    const perUnit = effectiveHpPerUnit(t, stats[t], baseMods, config.shieldReplenishBonus || 0);
    hp[t] = { perUnit, pool: perUnit * (config.counts[t] || 0), initialCount: config.counts[t] || 0 };
  });
  return { stats, accum, periodic, proc, constant, log, hp, fc: fcByType, wallMitigationPercent: config.wallMitigationPercent || 0 };
}

function frontType(hpState) {
  for (const t of ORDER) if (hpState[t].pool > 1e-6) return t;
  return null;
}

function totalPool(hpState) {
  return ORDER.reduce((s, t) => s + Math.max(0, hpState[t].pool), 0);
}

function runBattle(attackerConfig, defenderConfig, heroesDb, opts) {
  const mech = Object.assign({}, DEFAULT_MECH, opts.mech || {});
  const maxTurns = opts.maxTurns || 60;
  // trialSeed(v4.14): 確率発動スキルの発動判定に使う乱数シード。既定は0で、同じ編成なら常に同じ
  // 発動パターン・同じ結果になる(通常の単発シミュレーション・必要兵力倍率の逆算はこの既定値で動作する)。
  // runBattleMonteCarlo()は、試行ごとに異なる値を渡すことで実際の乱数を使ったばらつきを再現する。
  const trialSeed = opts.trialSeed != null ? opts.trialSeed : 0;

  const enemyDebuffAccumOnDefender = freshModAccum(); // 攻撃側の英雄が相手(defender)に与えるデバフ
  const enemyDebuffAccumOnAttacker = freshModAccum(); // 防御側の英雄が相手(attacker)に与えるデバフ

  const A = prepareSide(attackerConfig, heroesDb, enemyDebuffAccumOnDefender);
  const D = prepareSide(defenderConfig, heroesDb, enemyDebuffAccumOnAttacker);

  // 敵デバフ(英雄のenemyDebuff、および追加バフ源の敵デバフ分)を反映。
  // 注意: 以前はここが `.all.taken` だけを読み、しかもORDER.forEach内で無関係に3回掛けてしまう
  // バグがあった(enemyDebuff.stat='dealt'の英雄は一切反映されず、万一.takenを使うと3乗されて
  // 過大評価される状態だった)。dealt/taken/hpのいずれで宣言されても1回だけ正しく反映するよう修正。
  const dDebuffMult = toMultiplier(enemyDebuffAccumOnDefender);
  const aDebuffMult = toMultiplier(enemyDebuffAccumOnAttacker);
  // 敵デバフは周期スキルの対象になる英雄がいないため、ターンごとに再計算されるmods(下記modsForTurn)
  // に対して、毎ターン共通の乗算レイヤーとしてそのつど掛け合わせる。

  const scale = opts.scale != null ? opts.scale : 1;

  const lossesA = { shield: 0, spear: 0, archer: 0 };
  const lossesD = { shield: 0, spear: 0, archer: 0 };
  const history = [];

  let turn = 0;
  let winner = 'undecided';
  const initTotalA = totalPool(A.hp);
  const initTotalD = totalPool(D.hp);
  if (initTotalA <= 0 && initTotalD <= 0) winner = 'draw';
  else if (initTotalA <= 0) winner = 'defender';
  else if (initTotalD <= 0) winner = 'attacker';

  while (winner === 'undecided' && turn < maxTurns) {
    turn++;
    // ターン開始時点のスナップショットを両軍分とっておき、以降の狙い先・生死判定は
    // すべてこのスナップショットを基準にする(「両軍同時に攻撃」を厳密にシミュレートするため。
    // 片方の攻撃結果を先に反映してからもう片方の反撃を計算すると、後攻側が不当に不利になる)。
    const fA0 = frontType(A.hp);
    const fD0 = frontType(D.hp);
    if (!fA0 || !fD0) break;
    const aliveA0 = {}, aliveD0 = {};
    ORDER.forEach(t => { aliveA0[t] = A.hp[t].pool > 1e-6; aliveD0[t] = D.hp[t].pool > 1e-6; });

    // このターンで実際に有効な周期・確率発動スキルを反映したmodsを都度計算し、敵デバフの乗算も合成する。
    const { mods: aModsTurn, activeList: aActiveSkills } = modsForTurn(A, turn, 'attacker', trialSeed);
    const { mods: dModsTurn, activeList: dActiveSkills } = modsForTurn(D, turn, 'defender', trialSeed);
    ['dealt', 'taken', 'hp'].forEach(stat => {
      dModsTurn.all[stat] *= dDebuffMult.all[stat];
      aModsTurn.all[stat] *= aDebuffMult.all[stat];
    });

    // このターンの各兵科の現存数(ターン開始時点の残りHPプールから逆算)に応じたダメージを計算
    const curCountsA = {}, curCountsD = {};
    ORDER.forEach(t => {
      curCountsA[t] = A.hp[t].perUnit > 0 ? A.hp[t].pool / A.hp[t].perUnit : 0;
      curCountsD[t] = D.hp[t].perUnit > 0 ? D.hp[t].pool / D.hp[t].perUnit : 0;
    });
    const dmgAtoD = {};
    const dmgDtoA = {};
    ORDER.forEach(at => {
      const effCountA = effectiveCountForDamage(curCountsA, at, mech.countScalingExponent);
      dmgAtoD[at] = {};
      ORDER.forEach(tt => {
        // fcSkill(攻撃側の兵科, 攻撃側のその兵科の火晶Lv) / fcSkill(防御側の兵科, 防御側のその兵科の火晶Lv)
        // となるよう、それぞれの兵科自身の火晶レベルを渡す(v4.7で兵科ごとの火晶レベルに対応)。
        dmgAtoD[at][tt] = effCountA * unitDamage(at, A.stats[at], tt, D.stats[tt], A.fc[at], D.fc[tt], aModsTurn, dModsTurn, mech, scale);
      });
      const effCountD = effectiveCountForDamage(curCountsD, at, mech.countScalingExponent);
      dmgDtoA[at] = {};
      ORDER.forEach(tt => {
        dmgDtoA[at][tt] = effCountD * unitDamage(at, D.stats[at], tt, A.stats[tt], D.fc[at], A.fc[tt], dModsTurn, aModsTurn, mech, scale);
      });
    });
    if (D.wallMitigationPercent) {
      ORDER.forEach(at => ORDER.forEach(tt => { dmgAtoD[at][tt] *= (1 - D.wallMitigationPercent / 100); }));
    }
    if (A.wallMitigationPercent) {
      ORDER.forEach(at => ORDER.forEach(tt => { dmgDtoA[at][tt] *= (1 - A.wallMitigationPercent / 100); }));
    }

    // ターン開始時点のスナップショット(alive0/front0)を使って、狙い先とダメージ量(delta)を先に確定させる。
    // pool自体はまだ一切変更しない(=完全な同時解決)。
    function computeDeltas(aliveAttacker0, dmgTable, defenderFront0, defenderArcherAlive0) {
      const delta = { shield: 0, spear: 0, archer: 0 };
      ORDER.forEach(at => {
        if (!aliveAttacker0[at]) return;
        if (!defenderFront0) return;
        if (at === 'spear' && defenderArcherAlive0 && defenderFront0 !== 'archer') {
          delta.archer += dmgTable[at].archer * mech.ambushRate;
          delta[defenderFront0] += dmgTable[at][defenderFront0] * (1 - mech.ambushRate);
        } else {
          delta[defenderFront0] += dmgTable[at][defenderFront0];
        }
      });
      return delta;
    }

    const deltaToD = computeDeltas(aliveA0, dmgAtoD, fD0, aliveD0.archer);
    const deltaToA = computeDeltas(aliveD0, dmgDtoA, fA0, aliveA0.archer);

    const poolBeforeD = {}, poolBeforeA = {};
    ORDER.forEach(t => { poolBeforeD[t] = D.hp[t].pool; poolBeforeA[t] = A.hp[t].pool; });

    ORDER.forEach(t => {
      D.hp[t].pool = Math.max(0, D.hp[t].pool - deltaToD[t]);
      A.hp[t].pool = Math.max(0, A.hp[t].pool - deltaToA[t]);
    });

    // このターンの損耗数(=相手側から見たキル数)を、消費されたHPプールから兵数換算で算出する。
    const attackerLossesThisTurn = { shield: 0, spear: 0, archer: 0 };
    const defenderLossesThisTurn = { shield: 0, spear: 0, archer: 0 };
    ORDER.forEach(t => {
      attackerLossesThisTurn[t] = A.hp[t].perUnit > 0 ? (poolBeforeA[t] - A.hp[t].pool) / A.hp[t].perUnit : 0;
      defenderLossesThisTurn[t] = D.hp[t].perUnit > 0 ? (poolBeforeD[t] - D.hp[t].pool) / D.hp[t].perUnit : 0;
    });

    history.push({
      turn,
      attackerTotal: totalPool(A.hp),
      defenderTotal: totalPool(D.hp),
      // attackerLosses = 攻撃側自身がこのターンに失った兵数(=防御側からみたキル数)
      // defenderLosses = 防御側自身がこのターンに失った兵数(=攻撃側からみたキル数)
      attackerLosses: attackerLossesThisTurn,
      defenderLosses: defenderLossesThisTurn,
      // attackerActiveSkills/defenderActiveSkills = このターン「発動した」と表示すべき、変動要素のスキル一覧
      // (周期発動スキル=確定的な周期条件、確率発動スキル=実際のchance%に従った疑似乱数の一例。
      // 常時発動しているスキル(遠征スキル・専用装備スキル・敵デバフ)はsideConstants側に1回だけ記載)
      attackerActiveSkills: aActiveSkills,
      defenderActiveSkills: dActiveSkills,
    });

    const totA = totalPool(A.hp);
    const totD = totalPool(D.hp);
    if (totA <= 0 && totD <= 0) { winner = 'draw'; break; }
    if (totD <= 0) { winner = 'attacker'; break; }
    if (totA <= 0) { winner = 'defender'; break; }
  }

  ORDER.forEach(t => {
    const remainA = A.hp[t].perUnit > 0 ? A.hp[t].pool / A.hp[t].perUnit : 0;
    const remainD = D.hp[t].perUnit > 0 ? D.hp[t].pool / D.hp[t].perUnit : 0;
    lossesA[t] = Math.max(0, A.hp[t].initialCount - remainA);
    lossesD[t] = Math.max(0, D.hp[t].initialCount - remainD);
  });

  const remaining = {
    attacker: {
      shield: A.hp.shield.perUnit > 0 ? A.hp.shield.pool / A.hp.shield.perUnit : 0,
      spear: A.hp.spear.perUnit > 0 ? A.hp.spear.pool / A.hp.spear.perUnit : 0,
      archer: A.hp.archer.perUnit > 0 ? A.hp.archer.pool / A.hp.archer.perUnit : 0,
    },
    defender: {
      shield: D.hp.shield.perUnit > 0 ? D.hp.shield.pool / D.hp.shield.perUnit : 0,
      spear: D.hp.spear.perUnit > 0 ? D.hp.spear.pool / D.hp.spear.perUnit : 0,
      archer: D.hp.archer.perUnit > 0 ? D.hp.archer.pool / D.hp.archer.perUnit : 0,
    },
  };

  return {
    winner, endedAtTurn: turn,
    history, losses: { attacker: lossesA, defender: lossesD }, remaining,
    heroLogs: { attacker: A.log, defender: D.log },
    // sideConstants: 常時発動しているスキル(遠征スキル/専用装備スキル/敵デバフ)の一覧。
    // ターンによって変わらないため、「ターン毎の内訳」表とは別に1回だけ表示するために追加(v4.11)。
    sideConstants: { attacker: A.constant, defender: D.constant },
  };
}

// 【v4.14で追加】「同じ設定なら毎回同じ結果になるのはおかしい、確率スキルがあるなら結果もばらつく
// はずだ」というご指摘への対応。通常のrunBattle()は、必要兵力倍率の逆算(二分探索)や再現性の
// ために意図的に決定的(trialSeed固定)にしているが、これとは別に「実際の乱数を使って何度も
// 戦闘を試行し、勝率・損耗数のばらつきを統計的に確認する」ための関数を新設した。
// baseSeedを毎回変えて呼び出すことで(例: 呼び出し側でMath.random()等から生成)、試行するたびに
// 異なる乱数列を使った複数戦闘のサンプルが得られる。
// 戻り値: { trials, winRate:{attacker,defender,undecidedOrDraw}, attackerLossStats, defenderLossStats }
// (各lossStatsは兵科ごとに{avg,min,max}を持つ)
function runBattleMonteCarlo(attackerConfig, defenderConfig, heroesDb, opts, trials, baseSeed) {
  const n = Math.max(1, trials || 200);
  const base = baseSeed != null ? baseSeed : 0;
  const results = [];
  for (let i = 0; i < n; i++) {
    const trialOpts = Object.assign({}, opts, { trialSeed: `${base}_${i}` });
    results.push(runBattle(attackerConfig, defenderConfig, heroesDb, trialOpts));
  }
  const winAttacker = results.filter(r => r.winner === 'attacker').length;
  const winDefender = results.filter(r => r.winner === 'defender').length;
  const undecidedOrDraw = n - winAttacker - winDefender;
  function statsFor(sideKey, type) {
    const vals = results.map(r => r.losses[sideKey][type]);
    const sum = vals.reduce((a, b) => a + b, 0);
    return { avg: sum / n, min: Math.min(...vals), max: Math.max(...vals) };
  }
  const attackerLossStats = {}, defenderLossStats = {};
  ORDER.forEach(t => {
    attackerLossStats[t] = statsFor('attacker', t);
    defenderLossStats[t] = statsFor('defender', t);
  });
  const endedAtTurns = results.map(r => r.endedAtTurn);
  return {
    trials: n,
    winRate: { attacker: winAttacker / n, defender: winDefender / n, undecidedOrDraw: undecidedOrDraw / n },
    attackerLossStats, defenderLossStats,
    endedAtTurnStats: { avg: endedAtTurns.reduce((a, b) => a + b, 0) / n, min: Math.min(...endedAtTurns), max: Math.max(...endedAtTurns) },
  };
}

function findRequiredMultiplier(attackerConfig, defenderConfig, heroesDb, opts, searchOpts) {
  const { minM = 0.1, maxM = 10, iterations = 22 } = searchOpts || {};
  function scaled(m) {
    const c = JSON.parse(JSON.stringify(attackerConfig));
    ORDER.forEach(t => { c.counts[t] = (c.counts[t] || 0) * m; });
    return c;
  }
  function wins(m) {
    return runBattle(scaled(m), defenderConfig, heroesDb, opts).winner === 'attacker';
  }
  if (!wins(maxM)) return { found: false, message: `倍率${maxM}倍でも勝利条件を満たしませんでした。` };
  if (wins(minM)) return { found: true, multiplier: minM };
  let lo = minM, hi = maxM;
  for (let i = 0; i < iterations; i++) {
    const mid = (lo + hi) / 2;
    if (wins(mid)) hi = mid; else lo = mid;
  }
  return { found: true, multiplier: hi };
}
